# ============================================
# 心飞物流TMS 后端 push 编译门禁（Gitea Actions）
#
# 策略（2026-10-12 提速改造）：
# - 触发：push 到 master（每次推送兜底校验主干可编译）+ workflow_dispatch（可手动补跑）
# - 执行：ci/xinfei-ci（JDK21 + Maven 3.9.9）
# - 容器内路径（act_runner config.yaml container.options 决定）：
#     宿主 /data/m2 -> 容器 /root/.m2；宿主 /data/ci -> 容器 /ci:ro
#   settings.xml 已写死 localRepository=/root/.m2/repository，缓存本就持久共享，
#   历史浪费点只有一个：只 compile 不 install，内部 SNAPSHOT 从不进仓库。
# - mvn clean install（不再只 compile）双重作用：
#     ① 编译门禁，主干不可编译直接红；
#     ② 全部 SNAPSHOT（xf-common/xf-service-api 等内部模块）装进 /root/.m2/repository，
#        作为 deploy-backend.yml / deploy-be.sh 单服务发布去掉 -am 后的上游制品基线；
#        成功后把 HEAD 写入 /root/.m2/.xinfei-baseline.revision（=宿主 /data/m2/ 同名文件）。
# - concurrency：连续 push 只保留最新一轮，旧 run 自动取消，配合 runner capacity=1 不排队空转。
# ============================================
name: "CI-后端编译与测试门禁（push自动）"

on:
  push:
    branches: [master]
    # 只有前后端代码 / 构建编排提交才跑整条门禁 + 自动部署；纯文档、截图等非代码提交整轮跳过
    # （2026-10-14 用户拍板：“必须是修改了 Java/Vue 前后端代码，提交了才构建，更新文档构建干嘛”）。
    # 规则：混合提交里只要含一个非忽略路径仍会触发；手动 workflow_dispatch 不受 paths-ignore 影响，
    # 任何时候都能在 Gitea UI 强制全量重跑。用黑名单而非白名单：漏配顶多白构建一次，
    # 白名单漏配某类代码会导致“该部署的没部署”。
    paths-ignore:
      - 'docs/**'
      - '**/*.md'           # 含根目录 CLAUDE.md / README*.md
      - 'LICENSE'
      - '_shots/**'
      - '**/_shots/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: build-check-master
  cancel-in-progress: true

env:
  DEPLOY_HOST: "192.168.20.130" # 内网 Gitea/部署宿主机，换机器只改这里

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（内网 Gitea，不用 actions/checkout 以避免外网）
        run: |
          rm -rf ./* ./.??*
          git clone --depth 50 -b "${GITHUB_REF_NAME:-master}" \
            "http://${DEPLOY_HOST}:3000/xinfei/xinfei-tms.git" .

      - name: Maven 全量 install（JDK21，编译门禁 + 刷新单服务发布的 m2 基线）
        run: |
          set -e
          ls -ld /root/.m2 || { echo "::error::/root/.m2 未挂载，检查 act_runner container.options"; exit 1; }
          mvn -B clean install -T 1C -Dmaven.test.skip=true -s /ci/maven-settings.xml
          git rev-parse HEAD > /root/.m2/.xinfei-baseline.revision
          echo "m2 基线已刷新: $(cat /root/.m2/.xinfei-baseline.revision)"
        timeout-minutes: 25

      - name: Maven 测试门禁（ArchUnit 架构红线 + 各模块单测）
        # 曾经的盲区：push 只编译零测试。此步把《12》§8 横切红线（ArchUnit，如 xf-dispatch
        # ModuleArchitectureTest）与各模块单测接入 CI；install 已装好内部 SNAPSHOT，test 复用、无需 -am。
        # 2026-10-14 提速：全 reactor `mvn test` 串行空转 13 个模块（实际仅 4 个有测试）是主要耗时。
        #   ① 收窄到有测试的 4 个模块（xf-oms/xf-dispatch/xf-work/xf-netty），其余 9 个无测试模块不再空转；
        #   ② 加 -T 1C 并行；
        #   ③ 漏测兜底：一旦这 4 个模块之外出现新测试文件，自动回退全量 mvn test，不静默漏测。
        run: |
          set -e
          ls -ld /root/.m2 || { echo "::error::/root/.m2 未挂载，检查 act_runner container.options"; exit 1; }
          TEST_MODS="xf-oms,xf-dispatch,xf-work,xf-netty"
          EXTRA=$(git ls-files 'Test*.java' '*Test.java' '*Tests.java' '*TestCase.java' | grep -vE '^xf-(oms|dispatch|work|netty)/' || true)
          if [ -n "$EXTRA" ]; then
            echo "::warning::检测到 4 个测试模块之外的测试文件，回退全量 mvn test（避免漏测）："
            echo "$EXTRA"
            mvn -B test -T 1C -s /ci/maven-settings.xml
          else
            echo ">> 收窄测试到有测试的模块: $TEST_MODS（-T 1C 并行）"
            mvn -B test -T 1C -pl "$TEST_MODS" -s /ci/maven-settings.xml
          fi
        timeout-minutes: 15

  auto-deploy:
    # ============================================================
    # 变更感知自动部署（2026-10-14 用户拍板）：编译+测试门禁绿后自动执行。
    # 以「部署基线」/root/.m2/.xinfei-deploy.revision（上次成功部署的 HEAD）做 diff：
    #   - 后端：服务模块变更→只部署该服务；共享库(xf-common/xf-service-api 等)/
    #     根 pom/deploy 编排/.gitea 变更→全量收敛（保守正确）
    #   - 前端：xf-admin-ui-vue3→admin；xf-mobile/<端>→对应端；xf-mobile 共享→三端
    #   - diff 含 *.sql → 中止（DB 门禁），转人工以 db_approved=true 手动部署
    #   - 任一服务/端探活(后端4min/前端60s)未过→自动回滚 PREV；
    #     部署基线仅在全部成功后刷新
    #   - 对账自愈（2026-10-14 用户拍板）：滚动部署前写中断标记 .xinfei-deploy.inprogress，
    #     成功刷基线时删除；若上轮被 cancel-in-progress 取消（标记残留），本轮检测到即
    #     强制全量收敛覆盖中断轮全部变更——消除「取消留半新半旧」窗口
    #   - rabbit 健康指标：默认关（仅 oms/dispatch/netty 显式开），见 compose 锚点注释
    # ============================================================
    needs: [compile]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（内网 Gitea）
        run: |
          rm -rf ./* ./.??*
          git clone --depth 100 -b "${GITHUB_REF_NAME:-master}" \
            "http://${DEPLOY_HOST}:3000/xinfei/xinfei-tms.git" .

      - name: DB 变更门禁（diff 含 *.sql 即中止转人工）
        run: |
          BASE=$(cat /root/.m2/.xinfei-deploy.revision 2>/dev/null || true)
          # 浅克隆（--depth 100）可能够不到基线 commit：先尝试按 SHA 取回，保证跨提交 SQL 审计不丢。
          # 同一 job 后续「计算变更目标」step 共享本工作区，取回的 BASE 也让其在“仅超出浅克隆窗口”时走精确增量。
          if [ -n "$BASE" ] && ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "基线 $BASE 不在浅克隆窗口，尝试按需取回..."
            git fetch --depth 1 origin "$BASE" >/dev/null 2>&1 \
              || echo "::warning::基线 $BASE 取回失败（首次部署 / 历史被重写后旧 SHA 消失），SQL 审计退化为仅本次提交"
          fi
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "按部署基线 $BASE 审计 SQL 变更"
            SQL=$(git diff --name-only "$BASE" HEAD -- '*.sql' ':(exclude)codeback' 2>/dev/null || true)
          else
            # 基线真不可达（首次部署 / 历史重写后旧 SHA 消失）时的兜底：
            # 浅克隆里 `git rev-list --max-parents=0 HEAD` 取到的是“浅历史边界提交”而非仓库根，
            # 用它做全历史 diff 会把窗口内历史遗留 docs/*.sql 误判为待审 DDL（2026-10-15 曾因此误拦 auto-deploy）。
            # 故退化为只审本次提交（HEAD~1..HEAD），与 deploy-backend.yml 的兜底口径一致；
            # 是否需要全量收敛由下一步「计算变更目标」按“基线不可用→全量”处理。
            echo "::warning::部署基线不可达，SQL 门禁退化为仅审计本次提交（HEAD~1..HEAD）"
            SQL=$(git diff --name-only HEAD~1 HEAD -- '*.sql' ':(exclude)codeback' 2>/dev/null || true)
          fi
          if [ -n "$SQL" ]; then
            echo "::error::diff 含 *.sql，自动部署中止；请人工审核后以 db_approved=true 手动部署（或勾 check_only 清基线）"
            echo "$SQL"
            exit 1
          fi

      - name: 计算变更目标（后端服务集 SERVICES / 前端端集 APPS）
        run: |
          {
            echo 'declare -A MOD_OF=('
            echo '  [xf-auth]=xf-auth [xf-base]=xf-base [xf-oms]=xf-oms [xf-work]=xf-work'
            echo '  [xf-user]=xf-user [xf-file-server]=xf-file-server [xf-dispatch]=xf-dispatch [xf-aggregation]=xf-aggregation [xf-netty]=xf-netty'
            echo '  [xf-web-manager]=xf-web/xf-web-manager [xf-web-driver]=xf-web/xf-web-driver'
            echo '  [xf-web-courier]=xf-web/xf-web-courier [xf-web-customer]=xf-web/xf-web-customer'
            echo '  [xf-gateway]=xf-gateway'
            echo ')'
            echo 'ORDER="xf-auth xf-base xf-oms xf-work xf-user xf-file-server xf-dispatch xf-aggregation xf-netty xf-web-manager xf-web-driver xf-web-courier xf-web-customer xf-gateway"'
          } > /tmp/svc.sh
          source /tmp/svc.sh
          BASE=$(cat /root/.m2/.xinfei-deploy.revision 2>/dev/null || true)
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "部署基线不可用（首次/超出浅克隆窗口）→ 全量收敛"
            echo "SERVICES=ALL" >> "$GITHUB_ENV"; echo "APPS=admin driver courier customer" >> "$GITHUB_ENV"; exit 0
          fi
          # ---- 对账自愈：上轮部署被 cancel-in-progress 中断（标记残留）则本轮强制全量收敛 ----
          MARKER=/root/.m2/.xinfei-deploy.inprogress
          if [ -f "$MARKER" ]; then
            echo "检测到上轮部署中断标记（中断于 $(cat "$MARKER" 2>/dev/null || echo '?')）→ 对账自愈"
            if [ -z "$(git diff --name-only "$BASE" HEAD)" ]; then
              echo "基线..HEAD 无差异（上轮已部署完、仅基线刷新被打断）→ 直接补刷基线收尾"
              git rev-parse HEAD > /root/.m2/.xinfei-deploy.revision
              rm -f "$MARKER"
              echo "SERVICES=" >> "$GITHUB_ENV"; echo "APPS=" >> "$GITHUB_ENV"; exit 0
            fi
            echo "→ 本轮强制全量收敛，覆盖中断轮全部变更"
            rm -f "$MARKER"
            echo "SERVICES=ALL" >> "$GITHUB_ENV"; echo "APPS=admin driver courier customer" >> "$GITHUB_ENV"; exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          if [ -z "$CHANGED" ]; then
            echo "部署基线以来无变更（上一轮已全部部署）"
            echo "SERVICES=" >> "$GITHUB_ENV"; echo "APPS=" >> "$GITHUB_ENV"; exit 0
          fi
          echo "基线 $BASE 以来变更 $(echo "$CHANGED" | wc -l) 个文件"
          # ---- 后端归属 ----
          want=""; lib=0; other=0
          while IFS= read -r f; do
            if [ -z "$f" ]; then continue; fi
            case "$f" in
              deploy/*|.gitea/*) other=1; continue ;;
            esac
            d=$(dirname "$f")
            while [ "$d" != "." ] && [ ! -f "$d/pom.xml" ]; do d=$(dirname "$d"); done
            if [ "$d" = "." ]; then other=1; continue; fi
            hit=""
            for s in $ORDER; do
              if [ "${MOD_OF[$s]}" = "$d" ]; then hit=$s; break; fi
            done
            if [ -n "$hit" ]; then
              case " $want " in *" $hit "*) ;; *) want="$want $hit" ;; esac
            else
              lib=1
            fi
          done <<< "$CHANGED"
          if [ "$other" = "1" ] || [ "$lib" = "1" ]; then
            echo "共享库/根pom/编排/流水线变更 → 后端全量收敛"
            echo "SERVICES=ALL" >> "$GITHUB_ENV"
          elif [ -n "${want// /}" ]; then
            svcs=""
            for s in $ORDER; do
              case " $want " in *" $s "*) svcs="$svcs $s" ;; esac
            done
            echo "后端变更服务（部署序）:${svcs}"
            echo "SERVICES=${svcs# }" >> "$GITHUB_ENV"
          else
            echo "后端无变更"; echo "SERVICES=" >> "$GITHUB_ENV"
          fi
          # ---- 前端归属 ----
          fa=0; fd=0; fc=0; fu=0; fs=0
          while IFS= read -r f; do
            if [ -z "$f" ]; then continue; fi
            case "$f" in
              xf-admin-ui-vue3/*) fa=1 ;;
              xf-mobile/driver/*) fd=1 ;;
              xf-mobile/courier/*) fc=1 ;;
              xf-mobile/customer/*) fu=1 ;;
              xf-mobile/*) fs=1 ;;
            esac
          done <<< "$CHANGED"
          apps=""
          if [ "$fs" = "1" ]; then
            apps="admin driver courier customer"
          else
            if [ "$fa" = "1" ]; then apps="$apps admin"; fi
            if [ "$fd" = "1" ]; then apps="$apps driver"; fi
            if [ "$fc" = "1" ]; then apps="$apps courier"; fi
            if [ "$fu" = "1" ]; then apps="$apps customer"; fi
          fi
          if [ "$other" = "1" ]; then apps="admin driver courier customer"; fi
          echo "前端变更端:${apps:-（无）}"
          echo "APPS=$apps" >> "$GITHUB_ENV"

      - name: 后端 Maven 构建（优先复用 compile 全量 install 的 m2 fat jar，未命中再 -am package）
        if: env.SERVICES != ''
        timeout-minutes: 30
        run: |
          set -e
          # 向后端共享脚本追加 m2 复用函数（本 step 与下一步「镜像构建」都会 source /tmp/svc.sh）。
          # 背景：compile job 已对当前 HEAD 全量 clean install，14 个 fat jar 都持久化在挂载的 /root/.m2；
          # 两个 job 同一台 runner、同一 /data/m2，正常同一次 push clone 到同一 HEAD，可直接复用、省掉整轮重复打包。
          {
            echo 'm2_jar_of() { echo "/root/.m2/repository/com/xinfei/$(basename "$1")/1.0.0-SNAPSHOT/$(basename "$1")-1.0.0-SNAPSHOT.jar"; }'
            echo 'm2_cache_hit() {'
            echo '  local b cur s j'
            echo '  b=$(cat /root/.m2/.xinfei-baseline.revision 2>/dev/null || true)   # compile 全量 install 时写入的源码 SHA'
            echo '  cur=$(git rev-parse HEAD 2>/dev/null || true)'
            echo '  [ -n "$b" ] && [ "$b" = "$cur" ] || return 1                       # 基线!=当前 HEAD（reran 跨越新 push）一律不复用'
            echo '  for s in $1; do'
            echo '    j=$(m2_jar_of "${MOD_OF[$s]}")'
            echo '    [ -f "$j" ] || return 1'
            echo '    jar tf "$j" 2>/dev/null | grep -q "^BOOT-INF/" || return 1       # 必须确为 Spring Boot fat jar，防止拿 thin jar 打出跑不起来的镜像'
            echo '  done'
            echo '  return 0'
            echo '}'
          } >> /tmp/svc.sh
          source /tmp/svc.sh
          if [ "$SERVICES" = "ALL" ]; then SERVICES="$ORDER"; fi
          MODS=""
          for s in $SERVICES; do MODS="$MODS,${MOD_OF[$s]}"; done
          MODS=${MODS#,}
          TAG="auto-$(echo "${GITHUB_SHA}" | cut -c1-7)-$(date +%Y%m%d%H%M)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo ">> 自动部署后端:$SERVICES"
          if m2_cache_hit "$SERVICES"; then
            echo "::notice::m2 命中：compile 全量 install 的 fat jar 即当前 HEAD $(git rev-parse HEAD | cut -c1-7)，跳过 -am clean package"
          else
            echo ">> m2 未命中（基线不一致 / 坐标版本变更 / jar 缺失或非 fat），回退 Maven -pl $MODS -am clean package（-T 1C）"
            mvn -B -Dmaven.test.skip=true -T 1C -s /ci/maven-settings.xml -pl "$MODS" -am clean package
          fi

      - name: 后端镜像构建 + 记录回滚基线
        if: env.SERVICES != ''
        timeout-minutes: 20
        run: |
          set -e
          source /tmp/svc.sh
          if [ "$SERVICES" = "ALL" ]; then SERVICES="$ORDER"; fi
          : > /tmp/prev-tags
          # m2 复用判定（与上一步同一把尺：compile 基线==当前 HEAD 且 jar 存在且为 fat）。
          # 命中时 jar 在挂载卷 /root/.m2，与工作区 .ctx 分属不同文件系统，硬链接会报 Invalid cross-device，故用 cp；
          # 未命中走 target 产物（与 .ctx 同一工作区文件系统），沿用原硬链接不额外占盘。
          CUR_HEAD=$(git rev-parse HEAD)
          M2_HEAD=$(cat /root/.m2/.xinfei-baseline.revision 2>/dev/null || true)
          for s in $SERVICES; do
            m="${MOD_OF[$s]}"
            m2j="$(m2_jar_of "$m")"
            if [ "$M2_HEAD" = "$CUR_HEAD" ] && [ -f "$m2j" ] && jar tf "$m2j" 2>/dev/null | grep -q "^BOOT-INF/"; then
              jar="$m2j"; linkit="cp -f"
              echo ">> $s 复用 m2 fat jar: ${m2j##*/}"
            else
              jar=$(find "$m/target" -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' ! -name '*.original' | head -1)
              linkit="ln -f"
            fi
            if [ -z "$jar" ]; then echo "::error::未找到 $s 的 fat jar（m2 与 target 均无）"; exit 1; fi
            mkdir -p ".ctx/$s"; $linkit "$jar" ".ctx/$s/app.jar"
            img=$(docker inspect -f '{{.Config.Image}}' "$s" 2>/dev/null || true)
            if [ -n "$img" ]; then echo "$s ${img##*:}" >> /tmp/prev-tags; else echo "$s " >> /tmp/prev-tags; fi
            echo ">> docker build xinfei/$s:${TAG}"
            docker build -f deploy/apps/Dockerfile -t "xinfei/$s:${TAG}" ".ctx/$s"
          done

      - name: 写部署中断标记（对账自愈：本轮若被 cancel，下轮检测到此标记即强制全量收敛）
        # 放在滚动部署（首个改容器面的 step）之前：镜像构建被取消不碰容器，无需标记
        if: env.SERVICES != '' || env.APPS != ''
        run: |
          echo "${GITHUB_SHA}" > /root/.m2/.xinfei-deploy.inprogress
          echo "中断标记已写: $(cat /root/.m2/.xinfei-deploy.inprogress | cut -c1-7)"

      - name: 后端滚动部署 + 健康检查（失败当场内联回滚）
        id: be_deploy
        if: env.SERVICES != ''
        timeout-minutes: 40
        run: |
          # 不使用全局 set -e：失败分支必须把本轮已切换的服务逐个回滚完，不能被单条命令的非零码打断。
          source /tmp/svc.sh
          # FULL=1 表示本轮为全量收敛（原始 SERVICES=ALL / 对账自愈或编排变更触发）；只有全量才启用分批并行滚动
          if [ "$SERVICES" = "ALL" ]; then FULL=1; SERVICES="$ORDER"; else FULL=0; fi
          COMPOSE="deploy/apps/docker-compose.app.yml"
          tv_of() { echo "$(echo "$1" | tr 'a-z-' 'A-Z_')_TAG"; }
          health_of() { docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$1" 2>/dev/null || echo missing; }

          # 上一版本 tag 基线（镜像构建步骤写入 /tmp/prev-tags），形如 "<服务> <旧tag>"；首次部署旧 tag 为空
          declare -A PREV=()
          if [ -f /tmp/prev-tags ]; then
            while read -r s p; do [ -n "$s" ] && PREV["$s"]="$p"; done < /tmp/prev-tags
          fi
          deployed=()   # 本轮已 compose up 切换到新 tag 的服务（按部署序）
          rb_fail=0     # 回滚是否出现失败（有失败则保留中断标记，下轮对账收敛兜底）

          # 逆序回滚本轮已部署服务。必须内联在同一 shell：run#287 实测后置独立回滚 step
          # （if: steps.be_deploy.outcome=='failure'）在本 act_runner 失败路径被整体跳过、回滚不生效。
          rollback_all() {
            echo "::error::后端部署失败，按部署逆序回滚本轮已切换的 ${#deployed[@]} 个服务"
            for ((idx=${#deployed[@]}-1; idx>=0; idx--)); do
              s="${deployed[$idx]}"; tv=$(tv_of "$s"); prev="${PREV[$s]:-}"
              if [ -z "$prev" ]; then echo ">> 回滚跳过 $s（首次部署无旧 tag），需人工处理"; continue; fi
              echo ">> 回滚 $s -> $prev"
              if env TAG="${TAG:-rollback}" "$tv=$prev" docker compose --env-file /ci/apps.env \
                   -f "$COMPOSE" up -d "$s"; then
                rb=0
                for i in $(seq 1 24); do [ "$(health_of "$s")" = "healthy" ] && { rb=1; break; }; sleep 5; done
                if [ "$rb" = "1" ]; then echo ">> $s 已回滚并 healthy"; else echo "::warning::$s 已回滚到 $prev 但 2min 内未 healthy，需人工查看"; rb_fail=1; fi
              else
                echo "::warning::$s 回滚命令失败，需人工处理"; rb_fail=1
              fi
            done
          }

          # ===== 全量分批并行（仅 FULL=1；增量子集仍走本文件末尾原串行循环，逻辑零改动）=====
          # 波次按依赖划分、成员显式列出并以 ORDER 保序：
          #   W1 认证/基础(2) → W2 核心业务上(4) → W3 核心业务下(3) → W4 四个 BFF/web(4) → W5 网关独占(1)。
          # 波内：compose up 快速“串行发出”（本地镜像只 recreate、秒级，且避免同一 compose project 并发调 CLI 的竞态），
          #       随后“并行等待健康”——探活等待（每服务常 30~60s）才是串行滚动的耗时大头，并行后一波只等最慢的一个；
          # 波间：严格串行，保证依赖方向；单服务探活上限仍是 48×5s=240s，不放松。
          # 保护：5 波并集必须恰好覆盖整个 ORDER，否则（如以后新增服务忘记归波）自动回退原串行路径，绝不漏部署。
          W1=$(for s in $ORDER; do case "$s" in xf-auth|xf-base) echo "$s";; esac; done)
          W2=$(for s in $ORDER; do case "$s" in xf-oms|xf-work|xf-user|xf-file-server) echo "$s";; esac; done)
          W3=$(for s in $ORDER; do case "$s" in xf-dispatch|xf-aggregation|xf-netty) echo "$s";; esac; done)
          W4=$(for s in $ORDER; do case "$s" in xf-web-manager|xf-web-driver|xf-web-courier|xf-web-customer) echo "$s";; esac; done)
          W5=xf-gateway
          WAVES_OK=1
          for s in $ORDER; do
            flat=" $(echo "$W1 $W2 $W3 $W4 $W5" | tr '\n' ' ') "
            case "$flat" in *" $s "*) ;; *) echo "::warning::$s 未归入任何部署波次，分批保护失败，本轮回退串行"; WAVES_OK=0;; esac
          done

          deploy_wave() {
            local wave="$1" td s tv pids st
            td=$(mktemp -d)
            echo ">> 波次部署: $(echo "$wave" | tr '\n' ' ')"
            # 1) 串行快速发出本波所有 compose up（up 仅 recreate，耗时在后续探活）
            for s in $wave; do
              tv=$(tv_of "$s")
              if env TAG="$TAG" "$tv=$TAG" docker compose --env-file /ci/apps.env -f "$COMPOSE" up -d "$s" >"/tmp/wave-up-$s.log" 2>&1; then
                echo upok > "$td/$s"
              else
                echo upfail > "$td/$s"
              fi
            done
            # 2) 对 up 成功的服务并行健康等待（各自独立轮询，互不影响）
            pids=""
            for s in $wave; do
              [ "$(cat "$td/$s" 2>/dev/null)" = upok ] || continue
              (
                for i in $(seq 1 48); do [ "$(health_of "$s")" = "healthy" ] && { echo healthy > "$td/$s"; exit 0; }; sleep 5; done
                echo unhealthy > "$td/$s"
              ) &
              pids="$pids $!"
            done
            for p in $pids; do wait "$p" || true; done
            # 3) 汇总：本波全部 healthy 才返回；任一失败则把本波容器纳入回滚清单并整体逆序回滚
            local bad=""
            for s in $wave; do
              st=$(cat "$td/$s" 2>/dev/null || echo missing)
              echo "$s wave=$st"
              if [ "$st" = healthy ]; then deployed+=("$s"); else bad="$bad $s"; fi
            done
            rm -rf "$td"
            if [ -n "$bad" ]; then
              # upfail/未healthy 的容器可能已切到新镜像，统一纳入逆序回滚
              for s in $bad; do case " ${deployed[*]} " in *" $s "*) ;; *) deployed+=("$s");; esac; done
              echo "::error::波次失败服务:$bad（up 日志见 /tmp/wave-up-<服务>.log）"
              rollback_all
              [ "$rb_fail" = "0" ] && rm -f /root/.m2/.xinfei-deploy.inprogress
              echo "::error::全量分批部署失败，已按依赖逆序回滚本轮服务，部署基线不刷新"
              exit 1
            fi
          }

          if [ "$FULL" = "1" ] && [ "$WAVES_OK" = "1" ]; then
            echo ">> 全量收敛：14 服务分 5 波滚动（2/4/3/4/1，波内探活并行），网关最后"
            deploy_wave "$W1"; deploy_wave "$W2"; deploy_wave "$W3"; deploy_wave "$W4"; deploy_wave "$W5"
          else
            [ "$FULL" = "1" ] && echo ">> 全量但分批保护未通过，改用严格串行"
            echo ">> 增量/串行部署：逐个 compose up + 健康检查 + 失败即回滚"
          for s in $SERVICES; do
            tv=$(tv_of "$s")
            if ! env TAG="$TAG" "$tv=$TAG" docker compose --env-file /ci/apps.env \
                  -f "$COMPOSE" up -d "$s"; then
              deployed+=("$s")
              rollback_all
              [ "$rb_fail" = "0" ] && rm -f /root/.m2/.xinfei-deploy.inprogress   # 全部回滚成功才清标记；否则保留让下轮对账收敛
              echo "::error::$s compose up 命令失败，已回滚，部署基线不刷新"
              exit 1
            fi
            deployed+=("$s")
            ok=0
            for i in $(seq 1 48); do
              [ "$(health_of "$s")" = "healthy" ] && { ok=1; break; }
              sleep 5
            done
            echo "$s health=$(health_of "$s")"
            if [ "$ok" != "1" ]; then
              rollback_all
              [ "$rb_fail" = "0" ] && rm -f /root/.m2/.xinfei-deploy.inprogress   # 全部回滚成功才清标记；否则保留让下轮对账收敛
              echo "::error::$s 探活未过，已回滚，部署基线不刷新"
              exit 1
            fi
          done
          fi

      - name: 前端部署（并行构建 + 串行滚动/健康检查/失败回滚）
        # 后端部署 step 失败时本 step 被 runner 默认跳过（前序 step 失败即不再执行后续成功态 step），
        # 不再依赖 steps.be_deploy.outcome —— 该上下文在本 act_runner 失败路径不可靠（run#287 证伪）。
        # SERVICES 为空（纯前端变更）时后端 step 是 skipped（非 failure），本步照常执行。
        # 2026-10-15 提速：阶段 A 把 4 端镜像 build（pnpm/vite，CPU 密集且互不影响）并行，
        #   由原来 4 端串行 build（约 8~12min）压到约等于最慢一端（约 3~5min）；
        #   并行只发生在“不碰任何运行容器”的 build 阶段，任一 build 失败直接退出、零回滚负担。
        #   阶段 B 容器切换（up+健康检查+回滚+清旧 tag）仍逐端串行，部署/回滚语义与原先完全一致。
        if: env.APPS != ''
        timeout-minutes: 30
        run: |
          set -e
          COMPOSE=deploy/apps/docker-compose.app.yml
          FE_TAG="autofe-$(echo "${GITHUB_SHA}" | cut -c1-7)-$(date +%Y%m%d%H%M)"
          echo "FE_TAG=$FE_TAG" >> "$GITHUB_ENV"
          build_one() {
            case "$1" in
              admin) docker build -f deploy/apps/Dockerfile.admin-h5 -t "xinfei/xf-admin-h5:${FE_TAG}" . ;;
              *) docker build -f deploy/apps/Dockerfile.mobile-h5 \
                   --build-arg APP_PATH=xf-mobile --build-arg APP_SUBDIR="$1" \
                   --build-arg APP_NAME="xf-mobile-$1" -t "xinfei/xf-${1}-h5:${FE_TAG}" . ;;
            esac
          }

          # ---- 阶段 A：4 端并行构建镜像（后台各写独立日志，只 build 不切换容器）----
          echo ">> 并行构建前端镜像: $APPS"
          pids=""
          for app in $APPS; do
            ( build_one "$app" ) > "/tmp/fe-build-${app}.log" 2>&1 &
            pids="$pids $!"
          done
          build_fail=0
          for pid in $pids; do
            wait "$pid" || build_fail=1
          done
          if [ "$build_fail" != "0" ]; then
            for app in $APPS; do
              echo "==================== [$app] 构建日志（尾部 40 行）===================="
              tail -n 40 "/tmp/fe-build-${app}.log" 2>/dev/null || true
            done
            # 此时尚未 compose up 任何容器，运行面零改动、无需回滚
            echo "::error::一个或多个前端镜像构建失败（未改动任何运行容器，无需回滚）"
            exit 1
          fi
          echo ">> 全部前端镜像并行构建完成: $APPS"

          # ---- 阶段 B：逐端串行切换容器 + 健康检查 + 失败当场回滚（逻辑同改造前）----
          for app in $APPS; do
            img="xf-${app}-h5"; tv="$(echo "$img" | tr 'a-z-' 'A-Z_')_TAG"
            prev=$(docker inspect -f '{{.Config.Image}}' "$img" 2>/dev/null | sed -n 's/.*://p' || true)
            echo ">> [$app] 回滚基线 PREV=${prev:-（首次部署）}"
            proj=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$img" 2>/dev/null || echo "")
            if [ "$proj" != "xinfei-apps" ]; then docker rm -f "$img" 2>/dev/null || true; fi
            env TAG="$FE_TAG" "$tv=$FE_TAG" docker compose --env-file /ci/apps.env -f "$COMPOSE" up -d "$img"
            ok=0
            for i in $(seq 1 12); do
              st=$(docker inspect -f '{{.State.Health.Status}}' "$img" 2>/dev/null || echo missing)
              if [ "$st" = "healthy" ]; then ok=1; break; fi
              sleep 5
            done
            echo ">> [$app] health=$(docker inspect -f '{{.State.Health.Status}}' "$img" 2>/dev/null)"
            if [ "$ok" != "1" ]; then
              if [ -n "$prev" ]; then
                echo ">> [$app] 回滚 -> $prev"
                # 回滚成功才清中断标记；失败保留，让下轮对账收敛兜底
                if env TAG="$FE_TAG" "$tv=$prev" docker compose --env-file /ci/apps.env -f "$COMPOSE" up -d "$img"; then
                  rm -f /root/.m2/.xinfei-deploy.inprogress
                fi
              fi
              echo "::error::$app 前端自动部署失败"; exit 1
            fi
            OLD=$(docker images "xinfei/$img" --format '{{.Tag}}' | grep -vE "^${FE_TAG}$|^${prev}$" || true)
            if [ -n "$OLD" ]; then
              echo "$OLD" | xargs -r -I{} docker rmi "xinfei/$img:{}" 2>/dev/null || true
            fi
          done

      - name: 刷新部署基线（全部成功后；失败/中断不刷，下轮凭中断标记对账自愈）
        if: success()
        run: |
          git rev-parse HEAD > /root/.m2/.xinfei-deploy.revision
          rm -f /root/.m2/.xinfei-deploy.inprogress
          echo "部署基线已刷新: $(cat /root/.m2/.xinfei-deploy.revision)（中断标记已清除）"

      # 【预留·暂未启用】自动部署结果通知（企微/邮件 webhook），接入方式同 deploy-backend.yml 尾部预留

