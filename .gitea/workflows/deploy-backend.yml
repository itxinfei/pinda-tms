# ============================================
# 品达TMS 后端构建与部署（Gitea Actions，手动触发，参数化选服务）
#
# 策略（2026-10-11 用户拍板）：push 只跑 build-check.yml 编译门禁、不部署；
# 后端发布统一在本页手动 Run workflow，或在宿主执行 /data/pinda-deploy/deploy-be.sh。
# 两条路共用同一张「compose 服务 = Maven 模块」白名单与固定部署顺序。
#
# 能力：
#   - inputs.services 必填：选择本次发布的后端服务（逗号分隔，不默认任何服务，防误触 auth/网关；all=全部 14 个）
#   - 固定部署顺序：基础/业务服务先上，pd-gateway 始终最后切（见解析步骤 ORDER）
#   - Maven 构建（2026-10-12 提速）：单服务默认只 package 目标模块，上游 SNAPSHOT 取自
#     build-check 预热的持久 /data/m2；基线之后改过的内部模块先 install 刷新；
#     无基线 / 命中 pom.xml 变更 / 直接打包失败，三种情况自动回退 -am 全链构建（旧行为，稳妥兜底）。
#     all（全量发布）维持 -pl 全模块 -am clean package。
#   - 统一 deploy/apps/Dockerfile（运行时基镜像 pinda/jre21-fontconfig:1），每服务独立上下文 .ctx/<svc>/app.jar
#   - DB 变更门禁 / PREV 回滚基线 / 逐服务健康检查（最长 4 分钟）/ 失败自动回滚 / 演练开关 / 清悬空镜像
#
# 前置（服务器侧，2026-10-09 起就绪）：
#   - ci/pinda-ci:latest          = JDK21 + Maven 3.9.9 + Docker CLI + Compose v2
#   - /data/ci/maven-settings.xml = 阿里云 Maven settings（挂为 /ci，只读）
#   - /data/ci/apps.env           = 密钥（NACOS_*/REDIS_PASSWORD/XXL_JOB_ACCESS_TOKEN，0600）
#   - pinda/jre21-fontconfig:1    = 后端运行时基础镜像
#   - compose 顶层 name: pinda-apps；镜像 tag 支持 PD_<SVC>_TAG 逐服务覆盖
#
# 13 个可部署后端（compose 服务名 = 容器名 = 镜像名 pinda/<svc>）：
#   pd-auth(9000) pd-base(8185) pd-oms(8186) pd-work(8187) pd-user(8189)
#   pd-dispatch(8190) pd-aggregation(8191) pd-netty(8192)
#   pd-web-manager(8161) pd-web-driver(8162) pd-web-courier(8163) pd-web-customer(8164)
#   pd-gateway(8760)
# ============================================
name: "部署-后端微服务（手动·下拉选服务或全部）"

on:
  workflow_dispatch:
    inputs:
      services:
        description: "选择要部署的后端服务（all=全部 13 个；单选，多服务组合用服务器 deploy.sh be a,b）"
        type: choice
        options:
          - all
          - pd-auth
          - pd-base
          - pd-oms
          - pd-work
          - pd-user
          - pd-dispatch
          - pd-aggregation
          - pd-netty
          - pd-web-manager
          - pd-web-driver
          - pd-web-courier
          - pd-web-customer
          - pd-gateway
        default: all
      db_approved:
        description: "DB 变更门禁放行（diff 含 *.sql 时须人工审核后置 true）"
        type: boolean
        default: false
      check_only:
        description: "仅过 DB 门禁并刷新部署基线，不构建/部署任何服务（用于 SQL 迁移/文档/gitignore 等纯仓库变更清门禁）"
        type: boolean
        default: false
      simulate_failure:
        description: "演练：首个服务健康后人为失败，验证失败自动回滚"
        type: boolean
        default: false

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    # 不显式设 DOCKER_BUILDKIT：ci/pinda-ci 已内置 buildx，docker 29 默认走 BuildKit
    steps:
      - name: 检出代码（内网 Gitea，不用 actions/checkout 以避免外网）
        run: |
          rm -rf ./* ./.??*
          git clone --depth 50 -b "${GITHUB_REF_NAME:-master}" \
            "http://192.168.20.130:3000/pinda/pinda-tms.git" .

      - name: DB 变更脚本门禁
        # diff 含 *.sql（排除 codeback 备份区）= DDL 变更：未经人工审核不进部署。
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || echo "$BEFORE" | grep -qE '^0{40}$'; then
            # 手动触发无 before：优先用「上次成功部署」基线，覆盖跨多提交累积的 SQL 变更
            if [ -f /root/.m2/.pinda-deploy.revision ]; then
              BEFORE=$(cat /root/.m2/.pinda-deploy.revision 2>/dev/null || true)
            fi
            # 基线缺失 / 不在浅克隆历史内，退回 HEAD~1（仅覆盖最近一次提交）
            if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BEFORE=$(git rev-parse HEAD~1 2>/dev/null || true)
            fi
          fi
          SQL_CHANGES=""
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            SQL_CHANGES=$(git diff --name-only "$BEFORE" HEAD -- \
              '*.sql' ':(exclude)codeback' 2>/dev/null || true)
          fi
          if [ -n "$SQL_CHANGES" ]; then
            echo "检测到 SQL 变更："
            echo "$SQL_CHANGES"
            if [ "${{ github.event.inputs.db_approved }}" = "true" ]; then
              echo "db_approved=true，人工审核放行"
            else
              echo "::error::DB 门禁拦截：diff 含 *.sql，须人工审核后以 db_approved=true 放行"
              exit 1
            fi
          else
            echo "无 SQL 变更，门禁通过"
          fi

      - name: 解析服务白名单并计算 TAG
        # 生成 /tmp/pinda-svc.sh（MOD_OF 服务->模块映射 + ORDER 固定顺序），后续 step source 复用。
        # 用 echo 逐行生成而非缩进到 YAML 里的 heredoc，避免结束符被缩进导致不识别。
        run: |
          set -e
          {
            echo 'declare -A MOD_OF=('
            echo '  [pd-auth]=pd-auth'
            echo '  [pd-base]=pd-base'
            echo '  [pd-oms]=pd-oms'
            echo '  [pd-work]=pd-work'
            echo '  [pd-user]=pd-user'
            echo '  [pd-dispatch]=pd-dispatch'
            echo '  [pd-aggregation]=pd-aggregation'
            echo '  [pd-netty]=pd-netty'
            echo '  [pd-web-manager]=pd-web/pd-web-manager'
            echo '  [pd-web-driver]=pd-web/pd-web-driver'
            echo '  [pd-web-courier]=pd-web/pd-web-courier'
            echo '  [pd-web-customer]=pd-web/pd-web-customer'
            echo '  [pd-gateway]=pd-gateway'
            echo ')'
            echo 'ORDER="pd-auth pd-base pd-oms pd-work pd-user pd-dispatch pd-aggregation pd-netty pd-web-manager pd-web-driver pd-web-courier pd-web-customer pd-gateway"'
          } > /tmp/pinda-svc.sh
          source /tmp/pinda-svc.sh

          # check_only：仅过 DB 门禁 + 刷部署基线，不构建/部署（纯仓库变更清门禁用）
          if [ "${{ github.event.inputs.check_only }}" = "true" ]; then
            echo "CHECK_ONLY=true：跳过服务解析/构建/部署，仅保留 DB 门禁与部署基线刷新"
            echo "SERVICES=" >> "$GITHUB_ENV"
            echo 'SERVICES=""' >> /tmp/pinda-svc.sh
            exit 0
          fi

          RAW="${{ github.event.inputs.services }}"
          # 必填：空值直接失败，杜绝"页面不填参数直接 Run 就误部署 auth/网关"
          if [ -z "$(echo "$RAW" | tr -d '[:space:]')" ]; then
            echo "::error::必须显式填写要部署的服务（逗号分隔，或 all），不默认部署任何服务"
            exit 1
          fi
          WANT=""
          case "$RAW" in
            all|ALL)
              WANT="$ORDER"
              ;;
            *)
              OLDIFS="$IFS"; IFS=', '
              for t in $RAW; do
                IFS="$OLDIFS"
                [ -z "$t" ] && continue
                if [ -z "${MOD_OF[$t]+x}" ]; then
                  echo "::error::未知服务 '$t'，可选：$ORDER 或 all"
                  exit 1
                fi
                case " $WANT " in *" $t "*) ;; *) WANT="$WANT $t";; esac
              done
              IFS="$OLDIFS"
              ;;
          esac

          # 按 ORDER 固定顺序重排（保证网关最后），并去空白
          SERVICES=""
          for s in $ORDER; do
            case " $WANT " in *" $s "*) SERVICES="$SERVICES $s";; esac
          done
          SERVICES=$(echo $SERVICES)
          [ -n "$SERVICES" ] || { echo "::error::未选中任何有效服务"; exit 1; }

          # mvn -pl 模块路径逗号列表
          MODS=""
          for s in $SERVICES; do MODS="${MODS},${MOD_OF[$s]}"; done
          MODS="${MODS#,}"

          TAG=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "本次 TAG=$TAG"
          echo "选中服务（部署序）：$SERVICES"
          echo "Maven 模块（-pl）：$MODS"
          # all=全链构建；其余走 m2 基线增量（Maven 步骤据此分支）
          if [ "$RAW" = "all" ] || [ "$RAW" = "ALL" ]; then
            echo "FULL_BUILD=true" >> "$GITHUB_ENV"
          else
            echo "FULL_BUILD=false" >> "$GITHUB_ENV"
          fi

          echo "SERVICES=$SERVICES" >> "$GITHUB_ENV"
          echo "MODS=$MODS" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "SERVICES=\"$SERVICES\"" >> /tmp/pinda-svc.sh

      - name: 记录回滚基线（各服务部署前镜像 TAG）
        if: ${{ github.event.inputs.check_only != 'true' }}
        # 每行 "<服务> <旧tag>"；容器不存在则旧 tag 为空（首次部署，失败时跳过该服务回滚）
        run: |
          source /tmp/pinda-svc.sh
          : > /tmp/prev-tags
          for s in $SERVICES; do
            img=$(docker inspect -f '{{.Config.Image}}' "$s" 2>/dev/null || true)
            if [ -n "$img" ]; then tag="${img##*:}"; else tag=""; fi
            echo "$s $tag" >> /tmp/prev-tags
            echo "基线 $s -> ${tag:-（无容器，首次部署）}"
          done

      - name: Maven 打包选中模块（m2 基线增量优先，异常自动回退 -am）
        if: ${{ github.event.inputs.check_only != 'true' }}
        # 提速逻辑（与宿主 deploy-be.sh 同构）：
        #   1. 全量发布（all）：维持 -pl 全模块 -am clean package；
        #   2. 单/多服务：读 /root/.m2/.pinda-baseline.revision（build-check 每次 push 刷新；
        #      容器内 /root/.m2 = 宿主 /data/m2），git diff 基线..HEAD 把变更文件归属到内部
        #      模块（向上找最近含 pom.xml 的目录），变更的上游模块先 clean install，目标只
        #      clean package（不带 -am）；
        #   3. 无基线 / 基线 commit 不在浅克隆历史 / 命中任意 pom.xml / install 或 package 失败，
        #      一律回退原 -am 全链构建——任何不确定场景退化为旧行为，不会打出缺依赖的包。
        run: |
          set -e
          BASELINE_FILE=/root/.m2/.pinda-baseline.revision
          MVN_COMMON="-B -Dmaven.test.skip=true -s /ci/maven-settings.xml"

          fallback_build() {
            echo "::warning::回退 -am 全链构建（目标模块：$MODS）"
            mvn $MVN_COMMON -pl "$MODS" -am clean package
          }

          if [ "$FULL_BUILD" = "true" ]; then
            echo "全量发布（all），走 -am 全链构建"
            mvn $MVN_COMMON -pl "$MODS" -am clean package
            exit 0
          fi

          ls -ld /root/.m2 || { echo "::error::/root/.m2 未挂载，检查 act_runner container.options"; exit 1; }

          baseline=""
          [ -f "$BASELINE_FILE" ] && baseline=$(cat "$BASELINE_FILE" 2>/dev/null || true)
          if [ -z "$baseline" ] || ! git cat-file -e "${baseline}^{commit}" 2>/dev/null; then
            echo "m2 基线不可用（baseline='${baseline:-空}'，可能新版 build-check 尚未跑过）"
            fallback_build
            exit 0
          fi
          echo "m2 基线=$baseline  HEAD=$(git rev-parse HEAD)"

          # 变更文件 → 内部模块归属；命中 pom.xml（依赖/父结构可能变）直接保守回退
          changed_mods=""
          pom_changed=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              pom.xml|*/pom.xml) pom_changed=1; echo "命中 pom 变更：$f"; break ;;
            esac
            d=$(dirname "$f")
            while [ "$d" != "." ] && [ ! -f "$d/pom.xml" ]; do d=$(dirname "$d"); done
            [ "$d" = "." ] && continue
            case ",$changed_mods," in *",$d,"*) ;; *) changed_mods="$changed_mods,$d";; esac
          done < <(git diff --name-only "$baseline" HEAD)
          changed_mods="${changed_mods#,}"

          if [ "$pom_changed" = "1" ]; then
            fallback_build
            exit 0
          fi

          # 目标模块自身马上会 package，不必先 install
          install_mods=""
          if [ -n "$changed_mods" ]; then
            IFS=',' read -ra arr <<< "$changed_mods"
            for m in "${arr[@]}"; do
              [ -z "$m" ] && continue
              case ",$MODS," in
                *",$m,"*) echo "跳过目标模块自身：$m" ;;
                *) install_mods="$install_mods,$m" ;;
              esac
            done
          fi
          install_mods="${install_mods#,}"

          if [ -n "$install_mods" ]; then
            echo "基线后变更的上游模块，先 install：$install_mods"
            if ! mvn $MVN_COMMON -pl "$install_mods" clean install -T 1C; then
              echo "::warning::变更上游模块 install 失败"
              fallback_build
              exit 0
            fi
          else
            echo "基线后无上游模块变更，目标模块直接从 m2 解析打包"
          fi

          if ! mvn $MVN_COMMON -pl "$MODS" clean package; then
            echo "::warning::目标模块直接打包失败（m2 上游可能与源码不一致）"
            fallback_build
            exit 0
          fi
        timeout-minutes: 30

      - name: 准备镜像构建上下文（硬链接 fat jar，每目录只放一个 app.jar）
        if: ${{ github.event.inputs.check_only != 'true' }}
        run: |
          set -e
          source /tmp/pinda-svc.sh
          for s in $SERVICES; do
            m="${MOD_OF[$s]}"
            jar=$(find "$m/target" -maxdepth 1 -type f -name '*.jar' \
              ! -name '*sources*' ! -name '*javadoc*' ! -name '*.original' 2>/dev/null | head -1)
            if [ -z "$jar" ]; then
              echo "::error::未找到 $s（$m）的 fat jar"
              exit 1
            fi
            mkdir -p ".ctx/$s"
            ln -f "$jar" ".ctx/$s/app.jar"
            echo ">> $s <- $(basename "$jar") ($(du -h "$jar" | cut -f1))"
          done

      - name: 构建服务镜像
        if: ${{ github.event.inputs.check_only != 'true' }}
        run: |
          set -e
          for s in $SERVICES; do
            echo ">> docker build pinda/$s:$TAG"
            docker build -f deploy/apps/Dockerfile -t "pinda/$s:${TAG}" ".ctx/$s"
          done
        timeout-minutes: 20

      - name: 按序部署并逐服务健康检查（网关最后切）
        if: ${{ github.event.inputs.check_only != 'true' }}
        # PD_<SVC>_TAG 逐服务覆盖 compose 的 ${PD_<SVC>_TAG:-${TAG:-latest}}。
        # 健康检查走 docker.sock 的 docker inspect（job 容器独立网络，curl 宿主不可靠）。
        run: |
          set -e
          for s in $SERVICES; do
            echo ">> 部署 $s:$TAG"
            tagvar="$(echo "$s" | tr 'a-z-' 'A-Z_')_TAG"
            env TAG="$TAG" "$tagvar=$TAG" docker compose --env-file /ci/apps.env \
              -f deploy/apps/docker-compose.app.yml up -d "$s"
            env TAG="$TAG" "$tagvar=$TAG" docker compose --env-file /ci/apps.env \
              -f deploy/apps/docker-compose.app.yml ps "$s"
            ok=0
            for i in $(seq 1 48); do
              st=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$s" 2>/dev/null || echo missing)
              [ "$st" = "healthy" ] && { ok=1; break; }
              sleep 5
            done
            docker inspect -f '{{.Name}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$s" || true
            if [ "$ok" != "1" ]; then
              echo "::error::$s 部署后 4 分钟内未健康"
              exit 1
            fi
            if [ "${{ github.event.inputs.simulate_failure }}" = "true" ]; then
              echo "::warning::simulate_failure=true，$s 健康后人为失败以验证自动回滚"
              exit 1
            fi
          done
        timeout-minutes: 25

      - name: 记录本次部署基线（供下次手动触发的 SQL 门禁跨提交 diff）
        # 仅在全部服务健康后执行：失败/回滚时不刷新，保证基线始终指向"最后一次成功部署"。
        # check_only 模式无部署，此处刷新 = 标记"SQL/仓库变更已人工审核、无需部署"，使门禁基线越过该提交。
        run: |
          git rev-parse HEAD > /root/.m2/.pinda-deploy.revision
          echo "部署基线已刷新: $(cat /root/.m2/.pinda-deploy.revision)"

      - name: 失败自动回滚到上一版本
        # 逆序回滚（先网关后业务），仅回滚有 PREV 基线的服务；首次部署无基线则跳过。
        if: ${{ failure() && github.event.inputs.check_only != 'true' }}
        run: |
          rolled=""
          if [ -f /tmp/prev-tags ]; then
            while read -r s prev; do
              [ -z "$s" ] && continue
              if [ -z "$prev" ]; then
                echo "跳过 $s（首次部署无基线，需人工处理）"
                continue
              fi
              tagvar="$(echo "$s" | tr 'a-z-' 'A-Z_')_TAG"
              echo ">> 回滚 $s -> $prev"
              if env TAG="$TAG" "$tagvar=$prev" docker compose --env-file /ci/apps.env \
                   -f deploy/apps/docker-compose.app.yml up -d "$s"; then
                rolled="$rolled $s"
              fi
            done < <(tac /tmp/prev-tags)
          fi
          if [ -z "$rolled" ]; then
            echo "::error::部署失败且无可回滚基线（首次部署），需人工处理"
            exit 1
          fi
          ok=0
          for i in $(seq 1 48); do
            ok=1
            for s in $rolled; do
              st=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$s" 2>/dev/null || echo missing)
              [ "$st" = "healthy" ] || ok=0
            done
            [ "$ok" = "1" ] && break
            sleep 5
          done
          echo "::error::部署失败，已回滚：$rolled（复检 ok=$ok）——run 保持失败状态，发布未成功"
          exit 1

      - name: 清理旧镜像与构建缓存
        # 构建产物不保留（代码在 git，可随时重构建）：
        #   1. 悬空层直接清；
        #   2. pinda/pd-* 应用镜像删除所有未被运行容器引用的 tag（当前版本、回滚基线自动受 docker ps 检查保护；
        #      基础镜像 pinda/jre21-fontconfig 不匹配 pinda/pd-* 前缀，天然不受影响）；
        #   3. 构建缓存全清——Maven 依赖缓存在 /data/m2 持久共享，不受影响，仅 docker 层重建略慢。
        if: always()
        run: |
          docker image prune -f
          for img in $(docker images --format '{{.Repository}}:{{.Tag}}' \
              --filter=reference='pinda/pd-*' | grep -v ":$TAG$" || true); do
            if ! docker ps --format '{{.Image}}' | grep -qxF "$img"; then
              echo ">> 清理未使用镜像 $img"
              docker rmi "$img" 2>/dev/null || true
            fi
          done
          docker builder prune -a -f

      # ============================================================
      # 【预留·暂未启用】部署结果通知（企业微信 / 邮件 / 通用 webhook）
      #   用户暂无企微/邮件，先留坑。以后接入：取消下方注释，
      #   并把 DEPLOY_NOTIFY_WEBHOOK 配到 /data/ci/apps.env（0600）或仓库 secret。
      # - name: 部署结果通知（预留）
      #   if: always()
      #   run: |
      #     WEBHOOK="${DEPLOY_NOTIFY_WEBHOOK:-}"
      #     if [ -z "$WEBHOOK" ]; then echo "未配置 DEPLOY_NOTIFY_WEBHOOK，跳过通知"; exit 0; fi
      #     ST="${{ job.status }}"
      #     curl -sS -X POST "$WEBHOOK" -H 'Content-Type: application/json' \
      #       -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"[pinda-tms] deploy-backend $ST TAG=${TAG:-check_only} HEAD=$(git rev-parse --short HEAD)\"}}" || true
      # ============================================================
