# ============================================
# 品达TMS 后端自动构建与部署（Gitea Actions）
#
# 当前迁移阶段（2026-10-09）：pd-auth、pd-gateway 已迁到 JDK21 + Spring Boot 3.3，
# 本流水线「打包两个模块 -> 构建两个镜像 -> 滚动这两个容器」。
# ⚠️ 旧模块（pd-oms/pd-base/...）仍是 javax + Spring Boot 2.2，不能进构建；
#    每迁完一个模块，就在下面 paths、Maven、上下文、compose/端口清单中同步追加。
#
# 前置条件（服务器侧，2026-10-09 已就绪）：
#   - ci/pinda-ci:latest     = JDK21 + Maven3.9 + Docker CLI + Compose v2
#   - /data/ci/maven-settings.xml = 仓库凭据（挂载为 /ci，只读）
#   - /data/ci/apps.env      = 密钥（NACOS_USERNAME/PASSWORD/REDIS_PASSWORD，0600）
#   - pinda/jre21-fontconfig:1    = 运行时基础镜像
# ============================================
name: deploy-backend

on:
  push:
    branches: [master]
    # 注：曾用 paths 过滤，但 Gitea 1.21 对「workflow 文件自身变更」不触发 push 事件，
    # 且 paths 语义在旧版存在误判；改为任何 push 都触发（渐进期构建快，开销可接受）。
    # 需要精确过滤时再引入 paths，并用手动 workflow_dispatch 兜底。
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        # 不用 actions/checkout（避免从 GitHub 下载），直接 clone 内网 Gitea
        run: |
          rm -rf ./* ./.??*
          git clone --depth 50 -b "${GITHUB_REF_NAME:-master}" \
            "http://192.168.20.130:3000/pinda/pinda-tms.git" .

      - name: 计算镜像 TAG（git 短提交号）
        run: |
          TAG=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "本次构建 TAG=$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Maven 打包已迁移模块（JDK21，跳过测试）
        # -f 子模块 pom + -am（also make）：从父 pom 解析依赖链，自动先把
        # pd-common / pd-service-api 等依赖模块构建进 /root/.m2（挂载 /data/m2 缓存），
        # 再打包目标模块。不加 -am 时 CI 全新 .m2 会报依赖 SNAPSHOT 无法解析。
        run: |
          mvn -B -f pd-auth/pom.xml -am package -Dmaven.test.skip=true -s /ci/maven-settings.xml
          mvn -B -f pd-gateway/pom.xml -am package -Dmaven.test.skip=true -s /ci/maven-settings.xml
        timeout-minutes: 25

      - name: 准备镜像构建上下文（硬链接 jar，每目录只放一个 jar）
        run: |
          set -e
          # 镜像名 -> 模块目录
          declare -A MODS=(
            [pd-auth-server]=pd-auth
            [pd-gateway]=pd-gateway
          )
          for svc in "${!MODS[@]}"; do
            JAR=$(find "${MODS[$svc]}/target" -maxdepth 1 -type f -name '*.jar' \
              ! -name '*sources*' ! -name '*javadoc*' ! -name '*.original' 2>/dev/null | head -1)
            if [ -z "$JAR" ]; then
              echo "::error::未找到 ${MODS[$svc]} 的 fat jar"
              exit 1
            fi
            mkdir -p ".ctx/$svc"
            ln -f "$JAR" ".ctx/$svc/app.jar"
            echo ">> $svc <- $(basename "$JAR") ($(du -h "$JAR" | cut -f1))"
          done

      - name: 构建服务镜像
        run: |
          set -e
          for svc in pd-auth-server pd-gateway; do
            echo ">> docker build $svc:$TAG"
            docker build -f deploy/apps/Dockerfile -t "pinda/$svc:${TAG}" ".ctx/$svc"
          done
        timeout-minutes: 15

      - name: 滚动部署（只动这两个容器，不碰其他）
        run: |
          export TAG
          # 显式列出服务、不加 --remove-orphans：其他容器原样不动
          # /ci 由 runner 容器挂载（-v /data/ci:/ci:ro）
          docker compose --env-file /ci/apps.env -f deploy/apps/docker-compose.app.yml up -d \
            pd-gateway pd-auth-server
          # ps 也要带 --env-file，否则无默认值的 ${REDIS_PASSWORD} 等会解析失败
          docker compose --env-file /ci/apps.env -f deploy/apps/docker-compose.app.yml ps pd-gateway pd-auth-server
        timeout-minutes: 10

      - name: 部署后健康检查（容器 health，最长 4 分钟）
        run: |
          # 健康检查统一看 compose healthcheck（deploy/apps/docker-compose.app.yml 已配置），
          # 经 docker.sock 执行 docker inspect，不走容器网络（act job 容器独立网络，curl 宿主不可靠）
          ok=0
          for i in $(seq 1 48); do
            ok=1
            for c in pd-gateway pd-auth-server; do
              st=$(docker inspect -f '{{.State.Health.Status}}' "$c" 2>/dev/null || echo missing)
              [ "$st" = "healthy" ] || ok=0
            done
            [ "$ok" = "1" ] && break
            sleep 5
          done
          docker inspect -f '{{.Name}} health={{.State.Health.Status}}' pd-gateway pd-auth-server
          [ "$ok" = "1" ] || { echo "::error::容器未健康"; exit 1; }

      - name: 清理悬空镜像
        if: always()
        run: |
          # 只删无 tag 的悬空层（不带 -a），不影响在用镜像
          docker image prune -f
