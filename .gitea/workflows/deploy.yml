# ============================================
# 品达TMS 四端前端自动构建与部署（Gitea Actions）
# push 到 master 后：构建 4 个 H5 Nginx 镜像 -> 只滚动重启 4 个前端容器
#
# 说明：
#   - 本流水线只部署前端，不触碰后端容器（compose up 显式列出 4 个服务）。
#   - 后端流水线随 JDK21 业务迁移另写；旧版可从 git 历史取回参考。
#   - App 原生包 / 微信小程序不走 Docker，本线只管 H5：
#       管理端 8081 / 司机端 8082 / 快递员端 8083 / 客户端 8084
# ============================================
name: deploy-frontend

on:
  push:
    branches: [master]
    # 只在前端相关路径变化时触发；后端 push 由 deploy-backend.yml 接住，避免互相空跑
    paths:
      - 'pd-admin-ui-vue3/**'
      - 'pd-mobile/**'
      - 'deploy/apps/Dockerfile.admin-h5'
      - 'deploy/apps/Dockerfile.mobile-h5'
      - 'deploy/apps/nginx/**'
      - '.gitea/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest   # 由 act_runner 用本地 ci 镜像启动，挂载宿主 docker.sock
    steps:
      - name: 检出代码
        # 不用 actions/checkout（避免从 GitHub 下载），直接 clone 内网 Gitea
        run: |
          rm -rf ./* ./.??*
          git clone --depth 50 -b "${GITHUB_REF_NAME:-master}" \
            "http://192.168.20.130:3000/pinda/pinda-tms.git" .

      - name: 计算镜像 TAG（git 短提交号）
        run: |
          TAG=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "本次构建 TAG=$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: 构建管理端镜像（Vue3 + Vite）
        run: |
          docker build -f deploy/apps/Dockerfile.admin-h5 \
            -t "pinda/pd-admin-h5:${TAG}" .

      - name: 构建移动端三端 H5 镜像（pnpm workspace，参数化）
        run: |
          set -e
          # 子目录:镜像名
          TARGETS="driver:pd-driver-h5 courier:pd-courier-h5 customer:pd-customer-h5"
          for item in $TARGETS; do
            sub=${item%%:*}
            image=${item##*:}
            echo ">> 构建 $image ($sub)"
            docker build -f deploy/apps/Dockerfile.mobile-h5 \
              --build-arg APP_PATH=pd-mobile \
              --build-arg APP_SUBDIR="$sub" \
              --build-arg APP_NAME="pd-mobile-$sub" \
              -t "pinda/${image}:${TAG}" .
          done

      - name: 滚动部署（仅 4 个前端服务，不碰后端）
        run: |
          export TAG
          # 显式列出服务、不加 --remove-orphans：只更新前端，后端容器原样不动
          docker compose -f deploy/apps/docker-compose.app.yml up -d \
            pd-admin-h5 pd-driver-h5 pd-courier-h5 pd-customer-h5
          docker compose -f deploy/apps/docker-compose.app.yml ps \
            pd-admin-h5 pd-driver-h5 pd-courier-h5 pd-customer-h5

      - name: 部署后健康检查
        run: |
          # 给 nginx 一点启动时间
          for i in $(seq 1 10); do
            ok=1
            for p in 8081 8082 8083 8084; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 "http://127.0.0.1:${p}/") \
                || ok=0
              [ "$code" = "200" ] || ok=0
            done
            [ "$ok" = "1" ] && break
            sleep 3
          done
          for p in 8081 8082 8083 8084; do
            echo "端口 $p -> $(curl -s -o /dev/null -w '%{http_code}' -m 5 http://127.0.0.1:${p}/)"
          done
          [ "$ok" = "1" ] || { echo "::error::有前端端口未返回 200"; exit 1; }

      - name: 清理悬空镜像
        if: always()
        run: |
          # 只删无 tag 的悬空层（不带 -a），不影响任何在用镜像，也不碰后端
          docker image prune -f
