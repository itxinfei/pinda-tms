# ============================================
# 品达TMS 四端前端手动构建与部署（Gitea Actions）
# 2026-10-10：改为「仅手动触发」——自动 push 不再构建前端（避免构建并发打满服务器导致无响应）。
# 手动方式：Gitea 仓库 → Actions → 选中本流水线 → Run workflow（可指定要部署的端）
# 或：服务器上执行 /data/pinda-deploy/deploy-fe.sh [admin|driver|courier|customer|all]
#
# 说明：
#   - 本流水线只部署前端，不触碰后端容器（compose up 显式列出 4 个服务）。
#   - 后端流水线随 JDK21 业务迁移另写；旧版可从 git 历史取回参考。
#   - App 原生包 / 微信小程序不走 Docker，本线只管 H5：
#       管理端 8081 / 司机端 8082 / 快递员端 8083 / 客户端 8084
# ============================================
name: deploy-frontend

on:
  workflow_dispatch:
    inputs:
      target:
        description: '要部署的端（admin/driver/courier/customer/all，默认 all）'
        required: false
        default: 'all'

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest   # 由 act_runner 用本地 ci 镜像启动，挂载宿主 docker.sock
    env:
      # workflow_dispatch 传入要部署的端；默认 all
      DEPLOY_TARGET: ${{ github.event.inputs.target || 'all' }}
      # BuildKit 不在此处开：job 镜像 ci/pinda-ci 已内置 docker-buildx 插件，
      # docker 29 默认走 BuildKit；若设 DOCKER_BUILDKIT=1 反而强制 buildx 硬失败
      # （2026-10-10 实测 "Install the buildx component"）。

    steps:
      - name: 检出代码
        # 不用 actions/checkout（避免从 GitHub 下载），直接 clone 内网 Gitea
        run: |
          rm -rf ./* ./.??*
          git clone --depth 50 -b "${GITHUB_REF_NAME:-master}" \
            "http://192.168.20.130:3000/pinda/pinda-tms.git" .

      - name: 计算镜像 TAG（git 短提交号）
        run: |
          TAG=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "本次构建 TAG=$TAG (target=$DEPLOY_TARGET)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: 构建管理端镜像（Vue3 + Vite）
        run: |
          case "$DEPLOY_TARGET" in all|admin)
            docker build -f deploy/apps/Dockerfile.admin-h5 \
              -t "pinda/pd-admin-h5:${TAG}" .
          ;; esac

      - name: 构建移动端三端 H5 镜像（pnpm workspace，参数化）
        run: |
          set -e
          # 子目录:镜像名
          TARGETS="driver:pd-driver-h5 courier:pd-courier-h5 customer:pd-customer-h5"
          for item in $TARGETS; do
            sub=${item%%:*}
            image=${item##*:}
            case "$DEPLOY_TARGET" in all|"$sub") ;; *) continue ;; esac
            echo ">> 构建 $image ($sub)"
            docker build -f deploy/apps/Dockerfile.mobile-h5 \
              --build-arg APP_PATH=pd-mobile \
              --build-arg APP_SUBDIR="$sub" \
              --build-arg APP_NAME="pd-mobile-$sub" \
              -t "pinda/${image}:${TAG}" .
          done

      - name: 滚动部署（按 target 更新对应前端服务，不碰后端）
        run: |
          export TAG
          case "$DEPLOY_TARGET" in
            all) SVCS="pd-admin-h5 pd-driver-h5 pd-courier-h5 pd-customer-h5" ;;
            admin) SVCS="pd-admin-h5" ;;
            driver) SVCS="pd-driver-h5" ;;
            courier) SVCS="pd-courier-h5" ;;
            customer) SVCS="pd-customer-h5" ;;
            *) echo "未知 target: $DEPLOY_TARGET"; exit 1 ;;
          esac
          # 显式列出服务、不加 --remove-orphans：只更新目标前端，后端容器原样不动
          docker compose -f deploy/apps/docker-compose.app.yml up -d $SVCS
          docker compose -f deploy/apps/docker-compose.app.yml ps $SVCS

      - name: 部署后健康检查
        run: |
          # 给 nginx 一点启动时间
          case "$DEPLOY_TARGET" in
            all) PORTS="8081 8082 8083 8084" ;;
            admin) PORTS="8081" ;;
            driver) PORTS="8082" ;;
            courier) PORTS="8083" ;;
            customer) PORTS="8084" ;;
          esac
          for i in $(seq 1 10); do
            ok=1
            for p in $PORTS; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 "http://127.0.0.1:${p}/") \
                || ok=0
              [ "$code" = "200" ] || ok=0
            done
            [ "$ok" = "1" ] && break
            sleep 3
          done
          for p in $PORTS; do
            echo "端口 $p -> $(curl -s -o /dev/null -w '%{http_code}' -m 5 http://127.0.0.1:${p}/)"
          done
          [ "$ok" = "1" ] || { echo "::error::有前端端口未返回 200"; exit 1; }

      - name: 清理悬空镜像
        if: always()
        run: |
          # 只删无 tag 的悬空层（不带 -a），不影响任何在用镜像，也不碰后端
          docker image prune -f
