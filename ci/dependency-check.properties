# T-SEC-E4：OWASP Dependency-Check 运行参数（供 sca.yml / 本地扫描复用）
#
# 用法（任选其一）：
#   mvn -Ddependency-check.properties=ci/dependency-check.properties org.owasp:dependency-check-maven:check
#   或在命令行以 -D 覆盖同名单个键（-D 优先级高于本文件）。
#
# NVD API Key（建议申请，官方免费）：https://nvd.nist.gov/developers/request-an-api-key
# 无 key 时 NVD 限流更严、首次全量拉取可达 40min+；有 key 约 5min。
# 真实 key 不入库：CI 注入用环境变量 NVD_API_KEY（sca.yml 已透传），本地放 ~/.m2/settings.xml 或环境变量。
nvd.api.key=${env.NVD_API_KEY}

# 镜像源（内网无法直连 NVD 时，在此改为内网镜像地址后解除注释）：
# nvd.datafeed.url=https://nvd.nist.gov/feeds/json/cve/2.0/

# 代理（如需经代理出网，解除注释并按实情填写）：
# proxy.server=
# proxy.port=
