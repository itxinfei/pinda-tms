    environment:
      <<: [*jvm-small, *nacos-env, *redis-env]
      # Feign 客户端 UserClient 的 base url：web-customer 经 compose 网络直连 pd-user:8189。
      # client.user.url 在 Nacos 缺失，这里用环境变量注入（CLIENT_USER_URL 经 Spring 松弛绑定映射到 client.user.url）。
      CLIENT_USER_URL: "http://pd-user:8189"

  # ============================================================
  #  4 端前端（容器名按业务角色命名，端口自 2026-10-09 起固定，不再变动）
  # ============================================================
  #  端            容器名           端口   对应后端聚合层        状态
  #  后台管理      pd-admin-h5      8081   pd-web-manager:8161   Vue3 已就位
  #  司机端        pd-driver-h5     8082   pd-web-driver:8162    uniapp 已就位
  #  快递员端      pd-courier-h5    8083   pd-web-courier:8163   已就位
  #  客户小程序    pd-customer-h5   8084   pd-web-customer:8164  已就位
  #
  #  业务角色取自 docs/03-功能规划与需求说明.md 的「三端移动应用」：
  #  司机端 / 快递员端 / 客户小程序，加后台管理共 4 端。
  # ============================================================

  # ---------- 后台管理（Vue3 + Vite） ----------
  # 替代老 React 版后台（2026-10-09 下线：容器停用、镜像删除、git 取消跟踪，代码仅存本地）。
  # 端口 8081：老后台曾占用 8080，下线后不沿用，避免与历史书签/监控混淆。
  pd-admin-h5:
    <<: *app-static
    image: pinda/pd-admin-h5:${PD_ADMIN_H5_TAG:-${TAG:-latest}}
    container_name: pd-admin-h5
    restart: unless-stopped
    ports: ["8081:80"]
    healthcheck:
      <<: *hc-common
      # 容器内监听 80，宿主机才是 8081
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80' || exit 1"]
    environment:
      # server_name，容器间/内网访问用
      NGINX_HOST: 192.168.20.130
      # nginx 将 /prod-api 反代到网关。
      # 走 compose 同网络服务名 pd-gateway（容器间直连），不用宿主 eth0 IP
      # ——容器内访问宿主 bridge IP会被防火墙拦（实测超时）。
      DOCKER_REQUEST_DOMAIN_PREFIX: http://pd-gateway:8760

  # ---------- 司机端（uniapp H5，8082） ----------
  # 只有 H5 产物走 nginx 托管；微信小程序与 App 打包产物不走这里。
  pd-driver-h5:
    <<: *app-static
    image: pinda/pd-driver-h5:${PD_DRIVER_H5_TAG:-${TAG:-latest}}
    container_name: pd-driver-h5
    restart: unless-stopped
    ports: ["8082:80"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80' || exit 1"]
    environment:
      NGINX_HOST: 192.168.20.130
      DOCKER_REQUEST_DOMAIN_PREFIX: http://pd-gateway:8760

  # ---------- 快递员端（uniapp H5，8083，已就位） ----------
  # 由 Gitea Actions deploy-frontend 任务构建：
  #   docker build -f deploy/apps/Dockerfile.mobile-h5 \
  #     --build-arg APP_PATH=pd-mobile --build-arg APP_SUBDIR=courier \
  #     --build-arg APP_NAME=pd-mobile-courier -t pinda/pd-courier-h5:<tag> .
