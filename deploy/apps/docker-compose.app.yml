    environment:
      <<: [*jvm-small, *nacos-env, *redis-env]
      # 兜底：pd-druid 的 bootstrap 引用 spring.datasource.url（flat 段），其 Nacos mysql.yml 模板
      # 依赖 spring.datasource.db-name，而 db-name 注入（JVM/系统属性）实测未破环。这里直接给字面量 URL
      # （连现存库 pinda_tms），优先级最高且不含 ${...}，彻底打断 Circular placeholder。
      SPRING_DATASOURCE_URL: "jdbc:mysql://192.168.20.130:3306/pinda_tms?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true"
      # pd-druid bootstrap 还自引用 spring.datasource.driver-class-name，同样用环境变量破环
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"

