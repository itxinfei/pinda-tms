# ============================================
# 品达TMS 应用编排：14 个 Spring Boot 微服务 + 前端（新版 Vue3 后台 + uniapp H5）
#
# 部署（镜像 tag 由环境变量 TAG 注入，TAG 一般取 git 短提交号）：
#   TAG=1a2b3c4 docker compose -f deploy/apps/docker-compose.app.yml up -d --remove-orphans
#
# 说明：
#   - 微服务通过宿主机 IP 192.168.20.130 访问 MySQL/Redis/Nacos/RabbitMQ；
#   - 各服务沿用自身 bootstrap 中写定的 active profile，Nacos dataId 与之对应；
#   - gateway / auth-server 的 Nacos 地址与命名空间由 NACOS_* 环境变量注入。
#
# 加固（2026-10-06）：
#   1) ulimits nofile=65535：容器默认软限只有 1024，长连接的 gateway/netty 最先
#      中招，报 "Too many open files"，症状极易被误判成内存泄漏。
#   2) mem_limit：取「堆 + MaxMetaspaceSize + MaxDirectMemorySize + 线程栈 +
#      code cache」声明上限之和，保证正常水位不触顶。触顶说明该服务自身失控，
#      交给 cgroup 精确杀它一个，而不是整机换页让内核随机挑牺牲者。
#   3) JVM 补堆外上限与 OOM 现场：堆外不设限时，实测 -Xmx256m 的服务常驻能到
#      630M、线程 210 个——真正吃内存的在堆外。
#   4) healthcheck：TCP 探活。注意 docker 只会标记 unhealthy、不会自动重启，它的
#      作用是把「进程活着但不应答」（长 GC 停顿/死锁）暴露出来——restart:
#      unless-stopped 只管进程退出，管不了这种情况。
#   5) mem_reservation（2026-10-07）：cgroup v2 上 docker 把它落到 **memory.low**，
#      即"软预留"——内存压力时最后才被回收，而不是硬占用。加这条的原因很实在：
#      当天实测宿主 swap 已用 1.6G，mysqld 有 246M、Seata 有 632M 被换出，
#      而 mysql57 的 memory.min/low 都是 0——缓冲池被人挤走，表现就是查询突然变慢、
#      页面"很卡"。上限（mem_limit）只是天花板，防不住这种换页。
#      预留合计 应用 7.7G（9×640m + 5×384m + 32m）+ 中间件 2.4G ≈ 10.1G，小于 15.5G
#      物理内存，是刻意的：构建峰值（Maven 单轮实测 3.3G）压过来时，被回收的应该是
#      构建容器，而不是正在服务的 JVM 和数据库缓冲池。
#   6) cpu_shares（权重，不是硬顶）：16 核。给链路必经的 gateway/auth-server/netty
#      加倍权重，构建期（runner 限 --cpus=8）用户请求不会被 JIT/GC 抢光 CPU。
#      不给应用设硬 cpus 上限：JVM 启动期就要吃满几核，硬顶只会把部署拖成"起不来"。
#   7) oom_score_adj：中间件 -500、应用 -200、构建容器 +500（在 act_runner 的
#      container.options 里给），整机真出 OOM 时先杀构建，不动数据和服务。
# ============================================
name: pinda-apps

# 文件描述符（容器默认软限 1024）
x-ulimits: &app-ulimits
  nofile:
    soft: 65535
    hard: 65535

# JVM 档位
x-jvm-core: &jvm-core
  JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:MaxMetaspaceSize=256m -XX:MaxDirectMemorySize=256m -Xss512k -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -Dmybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml -Dmybatis-plus.typeAliasesPackage=com.itheima.pinda.entity -Dmybatis-plus.configuration.map-underscore-to-camel-case=true -Dmybatis-plus.configuration.cache-enabled=true -Dmybatis-plus.configuration.call-setters-on-nulls=false -Dmybatis-plus.configuration.jdbc-type-for-null=NULL -Dmybatis-plus.global-config.db-config.id-type=ASSIGN_ID -Dmybatis-plus.global-config.db-config.field-strategy=NOT_NULL -Dmybatis-plus.global-config.db-config.column-underline=true -Dmybatis-plus.global-config.db-config.logic-delete-value=0 -Dmybatis-plus.global-config.db-config.logic-not-delete-value=1 -Dmybatis-plus.global-config.banner=false"
  # JVM 系统属性（JAVA_TOOL_OPTIONS，优先级高于 Nacos 与 jar 内 druid.properties）：
  # 修复 druid-spring-boot-starter 1.1.x 的 druid.properties 自引用占位符导致的
  # "Circular placeholder reference"（Nacos 配置覆盖无效，优先级低于 druid.properties 的 @PropertySource）。
  # 给字面量后 Spring 先在系统属性层命中即返回，不再求值 ${...} 自引用，循环打破。网关切见其显式覆写。
  # 追加（2026-10-09）：mybatis-plus.mapper-locations / typeAliasesPackage 在各服务 bootstrap-prod.yml 里
  # 也是自引用占位符（${mybatis-plus.mapper-locations}），Nacos 未提供，jar 内也无默认值 → Circular。
  # 业务服务的 mapper 资源在 classpath:/mapper/**，实体包统一为 com.itheima.pinda.entity（aggregation 的
  # mapper 用 FQN DTO，给该包名仅用于占位符破环，不影响功能）。pd-gateway 因显式覆写 JAVA_TOOL_OPTIONS 不受本锚点影响。
  JAVA_TOOL_OPTIONS: "-Dbaidu.map.ak=${BAIDU_MAP_AK:-} -Dspring.datasource.druid.stat-view-servlet.enabled=false -Dspring.datasource.druid.web-stat-filter.enabled=false -Dspring.servlet.multipart.enabled=true -Dspring.servlet.multipart.max-file-size=100MB -Dspring.servlet.multipart.max-request-size=1000MB -Dspring.jackson.time-zone=GMT+8 -Dmybatis-plus.configuration.map-underscore-to-camel-case=true -Dmybatis-plus.configuration.cache-enabled=true -Dmybatis-plus.configuration.call-setters-on-nulls=false -Dmybatis-plus.configuration.jdbc-type-for-null=NULL -Dmybatis-plus.global-config.db-config.id-type=ASSIGN_ID -Dmybatis-plus.global-config.db-config.field-strategy=NOT_NULL -Dmybatis-plus.global-config.db-config.column-underline=true -Dmybatis-plus.global-config.db-config.logic-delete-value=0 -Dmybatis-plus.global-config.db-config.logic-not-delete-value=1 -Dmybatis-plus.global-config.banner=false -Dmybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml -Dmybatis-plus.typeAliasesPackage=com.itheima.pinda.entity -Dspring.datasource.druid.type=com.alibaba.druid.pool.DruidDataSource -Dspring.datasource.druid.driver-class-name=com.mysql.cj.jdbc.Driver -Dspring.datasource.druid.username=root -Dspring.datasource.druid.password=123456 -Dspring.datasource.druid.initial-size=5 -Dspring.datasource.druid.min-idle=5 -Dspring.datasource.druid.max-active=20 -Dspring.datasource.druid.max-wait=60000 -Dspring.datasource.druid.pool-prepared-statements=false -Dspring.datasource.druid.max-pool-prepared-statement-per-connection-size=20 -Dspring.datasource.druid.time-between-eviction-runs-millis=60000 -Dspring.datasource.druid.min-evictable-idle-time-millis=300000 -Dspring.datasource.druid.test-while-idle=true -Dspring.datasource.druid.test-on-borrow=false -Dspring.datasource.druid.test-on-return=false -Dspring.datasource.druid.stat-view-servlet.url-pattern=/druid/* -Dspring.datasource.druid.filter.stat.log-slow-sql=true -Dspring.datasource.druid.filter.stat.slow-sql-millis=5000 -Dspring.datasource.druid.filter.stat.merge-sql=true -Dspring.datasource.druid.filter.wall.config.multi-statement-allow=true"
  # 含空格的值（如日期格式）不能放进 JAVA_TOOL_OPTIONS（JVM 按空白切分参数会断裂），
  # 改用环境变量注入，Spring 松弛绑定 SPRINT_JACKSON_DATE_FORMAT -> spring.jackson.date-format，且不触发占位符死循环。
  SPRING_JACKSON_DATE_FORMAT: "yyyy-MM-dd HH:mm:ss"
  # 占位符破环（双保险）：JAVA_TOOL_OPTIONS 的 -D 串过长时，早期参数（如
  # stat-view-servlet.enabled / multipart.enabled / web-stat-filter.enabled / jackson.time-zone /
  # mybatis-plus.configuration.* / global-config.*）实测偶发未生效（仍 Circular placeholder）。
  # 这里再用环境变量松弛绑定兜一层，与已验证可用的 SPRING_DATASOURCE_DRUID_URL / CLIENT_USER_URL 同一机制。
  SPRING_DATASOURCE_DRUID_TYPE: "com.alibaba.druid.pool.DruidDataSource"
  SPRING_DATASOURCE_DRUID_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
  SPRING_DATASOURCE_DRUID_USERNAME: "root"
  SPRING_DATASOURCE_DRUID_PASSWORD: "123456"
  SPRING_DATASOURCE_DRUID_INITIAL_SIZE: "5"
  SPRING_DATASOURCE_DRUID_MIN_IDLE: "5"
  SPRING_DATASOURCE_DRUID_MAX_ACTIVE: "20"
  SPRING_DATASOURCE_DRUID_MAX_WAIT: "60000"
  SPRING_DATASOURCE_DRUID_POOL_PREPARED_STATEMENTS: "false"
  SPRING_DATASOURCE_DRUID_MAX_POOL_PREPARED_STATEMENT_PER_CONNECTION_SIZE: "20"
  SPRING_DATASOURCE_DRUID_TIME_BETWEEN_EVICTION_RUNS_MILLIS: "60000"
  SPRING_DATASOURCE_DRUID_MIN_EVICTABLE_IDLE_TIME_MILLIS: "300000"
  SPRING_DATASOURCE_DRUID_TEST_WHILE_IDLE: "true"
  SPRING_DATASOURCE_DRUID_TEST_ON_BORROW: "false"
  SPRING_DATASOURCE_DRUID_TEST_ON_RETURN: "false"
  SPRING_DATASOURCE_DRUID_STAT_VIEW_SERVLET_ENABLED: "false"
  SPRING_DATASOURCE_DRUID_STAT_VIEW_SERVLET_URL_PATTERN: "/druid/*"
  SPRING_DATASOURCE_DRUID_WEB_STAT_FILTER_ENABLED: "false"
  SPRING_DATASOURCE_DRUID_FILTER_STAT_LOG_SLOW_SQL: "true"
  SPRING_DATASOURCE_DRUID_FILTER_STAT_SLOW_SQL_MILLIS: "5000"
  SPRING_DATASOURCE_DRUID_FILTER_STAT_MERGE_SQL: "true"
  SPRING_DATASOURCE_DRUID_FILTER_WALL_CONFIG_MULTI_STATEMENT_ALLOW: "true"
  SPRING_SERVLET_MULTIPART_ENABLED: "true"
  SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: "100MB"
  SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: "1000MB"
  SPRING_JACKSON_TIME_ZONE: "GMT+8"
  MYBATIS_PLUS_MAPPER_LOCATIONS: "classpath*:/mapper/**/*.xml"
  MYBATIS_PLUS_TYPE_ALIASES_PACKAGE: "com.itheima.pinda.entity"
  MYBATIS_PLUS_CONFIGURATION_MAP_UNDERSCORE_TO_CAMEL_CASE: "true"
  MYBATIS_PLUS_CONFIGURATION_CACHE_ENABLED: "true"
  MYBATIS_PLUS_CONFIGURATION_CALL_SETTERS_ON_NULLS: "false"
  MYBATIS_PLUS_CONFIGURATION_JDBC_TYPE_FOR_NULL: "NULL"
  MYBATIS_PLUS_GLOBAL_CONFIG_DB_CONFIG_ID_TYPE: "ASSIGN_ID"
  MYBATIS_PLUS_GLOBAL_CONFIG_DB_CONFIG_FIELD_STRATEGY: "NOT_NULL"
  MYBATIS_PLUS_GLOBAL_CONFIG_DB_CONFIG_COLUMN_UNDERLINE: "true"
  MYBATIS_PLUS_GLOBAL_CONFIG_DB_CONFIG_LOGIC_DELETE_VALUE: "0"
  MYBATIS_PLUS_GLOBAL_CONFIG_DB_CONFIG_LOGIC_NOT_DELETE_VALUE: "1"
  MYBATIS_PLUS_GLOBAL_CONFIG_BANNER: "false"
x-jvm-small: &jvm-small
  JAVA_OPTS: "-Xms96m -Xmx192m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=128m -Xss512k -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -Dmybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml -Dmybatis-plus.typeAliasesPackage=com.itheima.pinda.entity -Dmybatis-plus.configuration.map-underscore-to-camel-case=true -Dmybatis-plus.configuration.cache-enabled=true -Dmybatis-plus.configuration.call-setters-on-nulls=false -Dmybatis-plus.configuration.jdbc-type-for-null=NULL -Dmybatis-plus.global-config.db-config.id-type=ASSIGN_ID -Dmybatis-plus.global-config.db-config.field-strategy=NOT_NULL -Dmybatis-plus.global-config.db-config.column-underline=true -Dmybatis-plus.global-config.db-config.logic-delete-value=0 -Dmybatis-plus.global-config.db-config.logic-not-delete-value=1 -Dmybatis-plus.global-config.banner=false"
  JAVA_TOOL_OPTIONS: "-Dbaidu.map.ak=${BAIDU_MAP_AK:-} -Dspring.datasource.druid.stat-view-servlet.enabled=false -Dspring.datasource.druid.web-stat-filter.enabled=false -Dspring.servlet.multipart.enabled=true -Dspring.servlet.multipart.max-file-size=100MB -Dspring.servlet.multipart.max-request-size=1000MB -Dspring.jackson.time-zone=GMT+8 -Dmybatis-plus.configuration.map-underscore-to-camel-case=true -Dmybatis-plus.configuration.cache-enabled=true -Dmybatis-plus.configuration.call-setters-on-nulls=false -Dmybatis-plus.configuration.jdbc-type-for-null=NULL -Dmybatis-plus.global-config.db-config.id-type=ASSIGN_ID -Dmybatis-plus.global-config.db-config.field-strategy=NOT_NULL -Dmybatis-plus.global-config.db-config.column-underline=true -Dmybatis-plus.global-config.db-config.logic-delete-value=0 -Dmybatis-plus.global-config.db-config.logic-not-delete-value=1 -Dmybatis-plus.global-config.banner=false"
  # 含空格的值（如日期格式）不能放进 JAVA_TOOL_OPTIONS（JVM 按空白切分参数会断裂），
  # 改用环境变量注入，Spring 松弛绑定 SPRINT_JACKSON_DATE_FORMAT -> spring.jackson.date-format，且不触发占位符死循环。
  SPRING_JACKSON_DATE_FORMAT: "yyyy-MM-dd HH:mm:ss"
  # 占位符破环（双保险，同 x-jvm-core 说明）：环境变量松弛绑定兜一层，覆盖
  # druid.* / servlet.multipart.* / jackson.time-zone / mybatis-plus.* 的自引用占位符。
  SPRING_DATASOURCE_DRUID_TYPE: "com.alibaba.druid.pool.DruidDataSource"
  SPRING_DATASOURCE_DRUID_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
  SPRING_DATASOURCE_DRUID_USERNAME: "root"
  SPRING_DATASOURCE_DRUID_PASSWORD: "123456"
  SPRING_DATASOURCE_DRUID_INITIAL_SIZE: "5"
  SPRING_DATASOURCE_DRUID_MIN_IDLE: "5"
  SPRING_DATASOURCE_DRUID_MAX_ACTIVE: "20"
  SPRING_DATASOURCE_DRUID_MAX_WAIT: "60000"
  SPRING_DATASOURCE_DRUID_POOL_PREPARED_STATEMENTS: "false"
  SPRING_DATASOURCE_DRUID_MAX_POOL_PREPARED_STATEMENT_PER_CONNECTION_SIZE: "20"
  SPRING_DATASOURCE_DRUID_TIME_BETWEEN_EVICTION_RUNS_MILLIS: "60000"
  SPRING_DATASOURCE_DRUID_MIN_EVICTABLE_IDLE_TIME_MILLIS: "300000"
  SPRING_DATASOURCE_DRUID_TEST_WHILE_IDLE: "true"
  SPRING_DATASOURCE_DRUID_TEST_ON_BORROW: "false"
  SPRING_DATASOURCE_DRUID_TEST_ON_RETURN: "false"
  SPRING_DATASOURCE_DRUID_STAT_VIEW_SERVLET_ENABLED: "false"
  SPRING_DATASOURCE_DRUID_STAT_VIEW_SERVLET_URL_PATTERN: "/druid/*"
  SPRING_DATASOURCE_DRUID_WEB_STAT_FILTER_ENABLED: "false"
  SPRING_DATASOURCE_DRUID_FILTER_STAT_LOG_SLOW_SQL: "true"
  SPRING_DATASOURCE_DRUID_FILTER_STAT_SLOW_SQL_MILLIS: "5000"
  SPRING_DATASOURCE_DRUID_FILTER_STAT_MERGE_SQL: "true"
  SPRING_DATASOURCE_DRUID_FILTER_WALL_CONFIG_MULTI_STATEMENT_ALLOW: "true"
  SPRING_SERVLET_MULTIPART_ENABLED: "true"
  SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: "100MB"
  SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: "1000MB"
  SPRING_JACKSON_TIME_ZONE: "GMT+8"
  MYBATIS_PLUS_MAPPER_LOCATIONS: "classpath*:/mapper/**/*.xml"
  MYBATIS_PLUS_TYPE_ALIASES_PACKAGE: "com.itheima.pinda.entity"
  MYBATIS_PLUS_CONFIGURATION_MAP_UNDERSCORE_TO_CAMEL_CASE: "true"
  MYBATIS_PLUS_CONFIGURATION_CACHE_ENABLED: "true"
  MYBATIS_PLUS_CONFIGURATION_CALL_SETTERS_ON_NULLS: "false"
  MYBATIS_PLUS_CONFIGURATION_JDBC_TYPE_FOR_NULL: "NULL"
  MYBATIS_PLUS_GLOBAL_CONFIG_DB_CONFIG_ID_TYPE: "ASSIGN_ID"
  MYBATIS_PLUS_GLOBAL_CONFIG_DB_CONFIG_FIELD_STRATEGY: "NOT_NULL"
  MYBATIS_PLUS_GLOBAL_CONFIG_DB_CONFIG_COLUMN_UNDERLINE: "true"
  MYBATIS_PLUS_GLOBAL_CONFIG_DB_CONFIG_LOGIC_DELETE_VALUE: "0"
  MYBATIS_PLUS_GLOBAL_CONFIG_DB_CONFIG_LOGIC_NOT_DELETE_VALUE: "1"
  MYBATIS_PLUS_GLOBAL_CONFIG_BANNER: "false"

# 服务级加固档位
x-app-core: &app-core
  mem_limit: 1g
  mem_reservation: 640m      # -> memory.low，实测本档常驻 459~676M
  oom_score_adj: -200
  cpu_shares: 1024
  ulimits: *app-ulimits
# 链路必经（gateway / auth-server / netty）：CPU 权重加倍，构建期不抢它们的核
x-app-edge: &app-edge
  <<: *app-core
  cpu_shares: 2048
x-app-small: &app-small
  mem_limit: 768m
  mem_reservation: 384m      # 实测本档常驻 382~500M
  oom_score_adj: -200
  cpu_shares: 1024
  ulimits: *app-ulimits
x-app-static: &app-static
  mem_limit: 128m
  mem_reservation: 32m       # nginx 实测常驻 14M
  oom_score_adj: -200
  cpu_shares: 512
  ulimits: *app-ulimits

# 探活公共参数（test 里的端口各服务单独写，YAML 锚点无法参数化）
x-hc-common: &hc-common
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 120s

# gateway / auth-server 接入 Nacos 所需的公共环境变量
x-nacos-env: &nacos-env
  NACOS_IP: 192.168.20.130
  NACOS_PORT: "8848"
  NACOS_ID: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
  # 其余服务的 bootstrap-*.yml 用占位 ${NACOS_SERVER_ADDR:192.168.20.130:8848}（含端口，整体作为 server-addr），
  # 这里显式注入，不再仅依赖 jar 内默认值
  NACOS_SERVER_ADDR: 192.168.20.130:8848
  # 2026-10-09 Nacos 已开启鉴权（此前是 AUTH_DISABLED，任何人可读写全部配置，
  # 而配置里含 MySQL/RabbitMQ 明文口令）。各服务 bootstrap-prod.yml 本就写了
  # ${NACOS_USERNAME:pinda} / ${NACOS_PASSWORD:pinda}，只是服务端一直没校验；
  # 现在必须由 compose 注入真实口令，否则服务读不到配置直接启动失败。
  # 口令在服务器 apps/.env(0600)，不进 Git。Nacos 账号 pinda 已被授予
  # pinda-tms 命名空间 (1cb93ce4-...) 的 READ,WRITE 权限。
  NACOS_USERNAME: ${NACOS_USERNAME:?缺少 .env 里的 NACOS_USERNAME}
  NACOS_PASSWORD: ${NACOS_PASSWORD:?缺少 .env 里的 NACOS_PASSWORD}

# 中间件地址兜底（环境变量优先级高于 jar 内默认值/nacos 配置）：
# 容器内 127.0.0.1 指向容器自身，必须显式指向宿主机映射端口
x-redis-env: &redis-env
  SPRING_REDIS_HOST: 192.168.20.130
  SPRING_REDIS_PORT: "6379"
  J2CACHE_LETTUCE_HOSTS: 192.168.20.130:6379
  REDIS_HOST: 192.168.20.130
  REDIS_PORT: "6379"
  # 2026-09 安全加固：Redis 已启用 requirepass，两处都要给。
  # SPRING_REDIS_* 供 Spring RedisTemplate（Lettuce）走 Spring Environment 用；
  # REDIS_PASSWORD 供 j2cache.properties 里的 ${REDIS_PASSWORD:} 占位符读 —— j2cache
  # 直接用 Properties 解析该文件，不经过 Spring Environment，Nacos 的
  # spring.redis.password 对它无效，两套机制互不相通。
  # 密码明文在服务器 /home/pdwl/redis-password.txt(0600) 与 compose 同级 .env(0600)，
  # 不进 Git。
  SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:?缺少 .env 里的 REDIS_PASSWORD}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?缺少 .env 里的 REDIS_PASSWORD}

# 百度地图 AK：代码用 System.getProperty("baidu.map.ak") 读取（BaiduMapUtils:35 / EntCoordSyncJob:29），
# 只能走 JVM 参数。用 JAVA_TOOL_OPTIONS 而不是 JAVA_OPTS，是为了不去覆写各服务已有的 JAVA_OPTS 锚点
# （网关那种显式覆写最容易漏带堆外参数）。留空 = 今天的状态：地址解析必定失败。
# 百度地图 AK 与 Druid 占位符修复的 JVM 覆写已统一收进 x-jvm-core / x-jvm-small（见其 JAVA_TOOL_OPTIONS）。
# 原 x-baidu-env 锚点废弃，避免与上面重复定义同一环境变量。


services:
  # ---------- 网关与鉴权（profile=test） ----------
  pd-gateway:
    <<: *app-edge
    image: pinda/pd-gateway:${PD_GATEWAY_TAG:-${TAG:-latest}}
    container_name: pd-gateway
    restart: unless-stopped
    ports: ["8760:8760"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8760' || exit 1"]
    environment:
      <<: [*jvm-core, *nacos-env, *redis-env]
      # CORS 白名单: 覆盖默认(localhost), 允许局域网前端端口访问(无端口=80页面)
      # 8081=新版Vue3后台, 8082=uniapp H5, 8083/8084=预留另两个app
      # 注意：本服务显式写了 JAVA_OPTS，会整体覆盖 x-jvm-core 锚点，
      # 所以堆外与 OOM 参数必须在下面这一行重复一遍，否则锚点的加固对网关无效。
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:MaxMetaspaceSize=256m -XX:MaxDirectMemorySize=256m -Xss512k -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -Dcors.allowed.origins=http://192.168.20.130,http://192.168.20.130:8080,http://192.168.20.130:8081,http://192.168.20.130:8082,http://192.168.20.130:8083,http://192.168.20.130:8084,http://localhost:8080,http://localhost:3000"
      # JWT 验签公钥的外部来源（详见 pd-auth-server 段注释与部署文档 §2.11）
      PINDA_JWT_PUB_KEY_PATH: ${PINDA_JWT_PUB_KEY_PATH:-}
      # 网关镜像不含任何 JDBC 连接池（无 druid/hikari/tomcat-jdbc），却因 mysql.yml 强制
      # spring.datasource.type=com.alibaba.druid.pool.DruidDataSource 而触发 DataSourceAutoConfiguration
      # 绑定失败（classpath 缺类，Nacos 覆写救不了）。网关本就不连库，排除该自动配置。
      # 同时保留上面 jvm-core 继承来的 druid 占位符修复，避免网关未来若恢复 druid 时再踩坑。
      JAVA_TOOL_OPTIONS: "-Dbaidu.map.ak=${BAIDU_MAP_AK:-} -Dspring.datasource.druid.stat-view-servlet.enabled=false -Dspring.datasource.druid.web-stat-filter.enabled=false -Dspring.servlet.multipart.enabled=true -Dspring.servlet.multipart.max-file-size=100MB -Dspring.servlet.multipart.max-request-size=1000MB -Dspring.jackson.time-zone=GMT+8 -Dmybatis-plus.configuration.map-underscore-to-camel-case=true -Dmybatis-plus.configuration.cache-enabled=true -Dmybatis-plus.configuration.call-setters-on-nulls=false -Dmybatis-plus.configuration.jdbc-type-for-null=NULL -Dmybatis-plus.global-config.db-config.id-type=ASSIGN_ID -Dmybatis-plus.global-config.db-config.field-strategy=NOT_NULL -Dmybatis-plus.global-config.db-config.column-underline=true -Dmybatis-plus.global-config.db-config.logic-delete-value=0 -Dmybatis-plus.global-config.db-config.logic-not-delete-value=1 -Dmybatis-plus.global-config.banner=false -Dspring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration"
    volumes:
      - ${PINDA_JWT_HOST_DIR:-/data/pinda-jwt}:/data/pinda-jwt:ro

  pd-auth-server:
    <<: *app-edge
    image: pinda/pd-auth-server:${PD_AUTH_SERVER_TAG:-${TAG:-latest}}
    container_name: pd-auth-server
    restart: unless-stopped
    ports: ["9000:9000"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000' || exit 1"]
    environment:
      <<: [*jvm-core, *nacos-env, *redis-env]
      # JWT 签名密钥对的外部来源。
      #
      # 背景：仓内 pd-auth-server/src/main/resources/client/pri.key 与
      # pd-tools-jwt/src/main/resources/pri.key 是被 git 跟踪的真实 RSA-2048 私钥，
      # 而这个仓库同时推到公开的 Gitee——任何读到源码的人都能签发任意 userId 的合法
      # token，网关的验签与吊销黑名单因此形同虚设。轮换的完整步骤在 docs/部署文档.md §2.11。
      #
      # 语义：留空等于"未设置"，RsaKeyHelper 会照旧回落 classpath，所以现在这套
      # 配置不改变任何在线行为；把新密钥放到宿主 /data/pinda-jwt 并在
      # /data/ci/deploy.env 里设好这两个变量，下次部署即切到仓外密钥。
      PINDA_JWT_PRI_KEY_PATH: ${PINDA_JWT_PRI_KEY_PATH:-}
      PINDA_JWT_PUB_KEY_PATH: ${PINDA_JWT_PUB_KEY_PATH:-}
    volumes:
      - ${PINDA_JWT_HOST_DIR:-/data/pinda-jwt}:/data/pinda-jwt:ro

  # ---------- 基础微服务 ----------
  pd-base:
    <<: *app-core
    image: pinda/pd-base:${PD_BASE_TAG:-${TAG:-latest}}
    container_name: pd-base
    restart: unless-stopped
    ports: ["8185:8185"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8185' || exit 1"]
    environment:
      <<: [*jvm-core, *nacos-env, *redis-env]
      # 各微服务 bootstrap 的 spring.datasource.druid.url 为自引用占位符，Nacos 无法覆盖；
      # 用环境变量给字面量（Spring 松弛绑定 SPRING_DATASOURCE_DRUID_URL -> spring.datasource.druid.url），破环。
      SPRING_DATASOURCE_DRUID_URL: "jdbc:mysql://192.168.20.130:3306/pd_base?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true"

  pd-oms:
