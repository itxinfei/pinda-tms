# ============================================
# 品达TMS 应用编排：14 个 Spring Boot 微服务 + 前端（新版 Vue3 后台 + uniapp H5）
#
# 部署（镜像 tag 由环境变量 TAG 注入，TAG 一般取 git 短提交号）：
#   TAG=1a2b3c4 docker compose -f deploy/apps/docker-compose.app.yml up -d --remove-orphans
#
# 说明：
#   - 微服务通过宿主机 IP 192.168.20.130 访问 MySQL/Redis/Nacos/RabbitMQ；
#   - 各服务沿用自身 bootstrap 中写定的 active profile，Nacos dataId 与之对应；
#   - gateway / auth-server 的 Nacos 地址与命名空间由 NACOS_* 环境变量注入。
#
# 加固（2026-10-06）：
#   1) ulimits nofile=65535：容器默认软限只有 1024，长连接的 gateway/netty 最先
#      中招，报 "Too many open files"，症状极易被误判成内存泄漏。
#   2) mem_limit：取「堆 + MaxMetaspaceSize + MaxDirectMemorySize + 线程栈 +
#      code cache」声明上限之和，保证正常水位不触顶。触顶说明该服务自身失控，
#      交给 cgroup 精确杀它一个，而不是整机换页让内核随机挑牺牲者。
#   3) JVM 补堆外上限与 OOM 现场：堆外不设限时，实测 -Xmx256m 的服务常驻能到
#      630M、线程 210 个——真正吃内存的在堆外。
#   4) healthcheck：TCP 探活。注意 docker 只会标记 unhealthy、不会自动重启，它的
#      作用是把「进程活着但不应答」（长 GC 停顿/死锁）暴露出来——restart:
#      unless-stopped 只管进程退出，管不了这种情况。
#   5) mem_reservation（2026-10-07）：cgroup v2 上 docker 把它落到 **memory.low**，
#      即"软预留"——内存压力时最后才被回收，而不是硬占用。加这条的原因很实在：
#      当天实测宿主 swap 已用 1.6G，mysqld 有 246M、Seata 有 632M 被换出，
#      而 mysql57 的 memory.min/low 都是 0——缓冲池被人挤走，表现就是查询突然变慢、
#      页面"很卡"。上限（mem_limit）只是天花板，防不住这种换页。
#      预留合计 应用 7.7G（9×640m + 5×384m + 32m）+ 中间件 2.4G ≈ 10.1G，小于 15.5G
#      物理内存，是刻意的：构建峰值（Maven 单轮实测 3.3G）压过来时，被回收的应该是
#      构建容器，而不是正在服务的 JVM 和数据库缓冲池。
#   6) cpu_shares（权重，不是硬顶）：16 核。给链路必经的 gateway/auth-server/netty
#      加倍权重，构建期（runner 限 --cpus=8）用户请求不会被 JIT/GC 抢光 CPU。
#      不给应用设硬 cpus 上限：JVM 启动期就要吃满几核，硬顶只会把部署拖成"起不来"。
#   7) oom_score_adj：中间件 -500、应用 -200、构建容器 +500（在 act_runner 的
#      container.options 里给），整机真出 OOM 时先杀构建，不动数据和服务。
# ============================================
name: pinda-apps

# 文件描述符（容器默认软限 1024）
x-ulimits: &app-ulimits
  nofile:
    soft: 65535
    hard: 65535

# JVM 档位
x-jvm-core: &jvm-core
  JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:MaxMetaspaceSize=256m -XX:MaxDirectMemorySize=256m -Xss512k -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp"
x-jvm-small: &jvm-small
  JAVA_OPTS: "-Xms96m -Xmx192m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=128m -Xss512k -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp"

# 服务级加固档位
x-app-core: &app-core
  mem_limit: 1g
  mem_reservation: 640m      # -> memory.low，实测本档常驻 459~676M
  oom_score_adj: -200
  cpu_shares: 1024
  ulimits: *app-ulimits
# 链路必经（gateway / auth-server / netty）：CPU 权重加倍，构建期不抢它们的核
x-app-edge: &app-edge
  <<: *app-core
  cpu_shares: 2048
x-app-small: &app-small
  mem_limit: 768m
  mem_reservation: 384m      # 实测本档常驻 382~500M
  oom_score_adj: -200
  cpu_shares: 1024
  ulimits: *app-ulimits
x-app-static: &app-static
  mem_limit: 128m
  mem_reservation: 32m       # nginx 实测常驻 14M
  oom_score_adj: -200
  cpu_shares: 512
  ulimits: *app-ulimits

# 探活公共参数（test 里的端口各服务单独写，YAML 锚点无法参数化）
x-hc-common: &hc-common
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 120s

# gateway / auth-server 接入 Nacos 所需的公共环境变量
x-nacos-env: &nacos-env
  NACOS_IP: 192.168.20.130
  NACOS_PORT: "8848"
  NACOS_ID: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
  # 其余服务的 bootstrap-*.yml 用占位 ${NACOS_SERVER_ADDR:192.168.20.130:8848}（含端口，整体作为 server-addr），
  # 这里显式注入，不再仅依赖 jar 内默认值
  NACOS_SERVER_ADDR: 192.168.20.130:8848

# 中间件地址兜底（环境变量优先级高于 jar 内默认值/nacos 配置）：
# 容器内 127.0.0.1 指向容器自身，必须显式指向宿主机映射端口
x-redis-env: &redis-env
  SPRING_REDIS_HOST: 192.168.20.130
  SPRING_REDIS_PORT: "6379"
  J2CACHE_LETTUCE_HOSTS: 192.168.20.130:6379
  REDIS_HOST: 192.168.20.130
  REDIS_PORT: "6379"

# 百度地图 AK：代码用 System.getProperty("baidu.map.ak") 读取（BaiduMapUtils:35 / EntCoordSyncJob:29），
# 只能走 JVM 参数。用 JAVA_TOOL_OPTIONS 而不是 JAVA_OPTS，是为了不去覆写各服务已有的 JAVA_OPTS 锚点
# （网关那种显式覆写最容易漏带堆外参数）。留空 = 今天的状态：地址解析必定失败。
x-baidu-env: &baidu-env
  JAVA_TOOL_OPTIONS: "-Dbaidu.map.ak=${BAIDU_MAP_AK:-}"

services:
  # ---------- 网关与鉴权（profile=test） ----------
  pd-gateway:
    <<: *app-edge
    image: pinda/pd-gateway:${PD_GATEWAY_TAG:-${TAG:-latest}}
    container_name: pd-gateway
    restart: unless-stopped
    ports: ["8760:8760"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8760' || exit 1"]
    environment:
      <<: [*jvm-core, *nacos-env, *redis-env]
      # CORS 白名单: 覆盖默认(localhost), 允许局域网前端端口访问(无端口=80页面)
      # 8081=新版Vue3后台, 8082=uniapp H5, 8083/8084=预留另两个app
      # 注意：本服务显式写了 JAVA_OPTS，会整体覆盖 x-jvm-core 锚点，
      # 所以堆外与 OOM 参数必须在下面这一行重复一遍，否则锚点的加固对网关无效。
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:MaxMetaspaceSize=256m -XX:MaxDirectMemorySize=256m -Xss512k -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -Dcors.allowed.origins=http://192.168.20.130,http://192.168.20.130:8080,http://192.168.20.130:8081,http://192.168.20.130:8082,http://192.168.20.130:8083,http://192.168.20.130:8084,http://localhost:8080,http://localhost:3000"
      # JWT 验签公钥的外部来源（详见 pd-auth-server 段注释与部署文档 §2.11）
      PINDA_JWT_PUB_KEY_PATH: ${PINDA_JWT_PUB_KEY_PATH:-}
    volumes:
      - ${PINDA_JWT_HOST_DIR:-/data/pinda-jwt}:/data/pinda-jwt:ro

  pd-auth-server:
    <<: *app-edge
    image: pinda/pd-auth-server:${PD_AUTH_SERVER_TAG:-${TAG:-latest}}
    container_name: pd-auth-server
    restart: unless-stopped
    ports: ["9000:9000"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000' || exit 1"]
    environment:
      <<: [*jvm-core, *nacos-env, *redis-env]
      # JWT 签名密钥对的外部来源。
      #
      # 背景：仓内 pd-auth-server/src/main/resources/client/pri.key 与
      # pd-tools-jwt/src/main/resources/pri.key 是被 git 跟踪的真实 RSA-2048 私钥，
      # 而这个仓库同时推到公开的 Gitee——任何读到源码的人都能签发任意 userId 的合法
      # token，网关的验签与吊销黑名单因此形同虚设。轮换的完整步骤在 docs/部署文档.md §2.11。
      #
      # 语义：留空等于"未设置"，RsaKeyHelper 会照旧回落 classpath，所以现在这套
      # 配置不改变任何在线行为；把新密钥放到宿主 /data/pinda-jwt 并在
      # /data/ci/deploy.env 里设好这两个变量，下次部署即切到仓外密钥。
      PINDA_JWT_PRI_KEY_PATH: ${PINDA_JWT_PRI_KEY_PATH:-}
      PINDA_JWT_PUB_KEY_PATH: ${PINDA_JWT_PUB_KEY_PATH:-}
    volumes:
      - ${PINDA_JWT_HOST_DIR:-/data/pinda-jwt}:/data/pinda-jwt:ro

  # ---------- 基础微服务 ----------
  pd-base:
    <<: *app-core
    image: pinda/pd-base:${PD_BASE_TAG:-${TAG:-latest}}
    container_name: pd-base
    restart: unless-stopped
    ports: ["8185:8185"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8185' || exit 1"]
    environment:
      <<: [*jvm-core, *nacos-env, *redis-env]

  pd-oms:
    <<: *app-core
    image: pinda/pd-oms:${PD_OMS_TAG:-${TAG:-latest}}
    container_name: pd-oms
    restart: unless-stopped
    ports: ["8186:8186"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8186' || exit 1"]
    environment:
      <<: [*jvm-core, *nacos-env, *redis-env, *baidu-env]

  pd-work:
    <<: *app-core
    image: pinda/pd-work:${PD_WORK_TAG:-${TAG:-latest}}
    container_name: pd-work
    restart: unless-stopped
    ports: ["8187:8187"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8187' || exit 1"]
    environment:
      <<: [*jvm-core, *nacos-env, *redis-env]

  pd-user:
    <<: *app-core
    image: pinda/pd-user:${PD_USER_TAG:-${TAG:-latest}}
    container_name: pd-user
    restart: unless-stopped
    ports: ["8189:8189"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8189' || exit 1"]
    environment:
      <<: [*jvm-core, *nacos-env, *redis-env]

  pd-dispatch:
    <<: *app-core
    image: pinda/pd-dispatch:${PD_DISPATCH_TAG:-${TAG:-latest}}
    container_name: pd-dispatch
    restart: unless-stopped
    ports: ["8190:8190"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8190' || exit 1"]
    environment:
      <<: [*jvm-core, *nacos-env, *redis-env, *baidu-env]

  pd-aggregation:
    <<: *app-core
    image: pinda/pd-aggregation:${PD_AGGREGATION_TAG:-${TAG:-latest}}
    container_name: pd-aggregation
    restart: unless-stopped
    ports: ["8191:8191"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8191' || exit 1"]
    environment:
      <<: [*jvm-core, *nacos-env, *redis-env]

  # netty 承载长连接与直接内存，按 core 档给足堆外额度
  pd-netty:
    <<: *app-edge
    image: pinda/pd-netty:${PD_NETTY_TAG:-${TAG:-latest}}
    container_name: pd-netty
    restart: unless-stopped
    ports: ["8192:8192"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8192' || exit 1"]
    environment:
      <<: [*jvm-core, *nacos-env, *redis-env, *baidu-env]

  pd-druid:
    <<: *app-small
    image: pinda/pd-druid:${PD_DRUID_TAG:-${TAG:-latest}}
    container_name: pd-druid
    restart: unless-stopped
    ports: ["8193:8193"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8193' || exit 1"]
    environment:
      <<: [*jvm-small, *nacos-env, *redis-env]

  # ---------- Web 聚合层 ----------
  pd-web-manager:
    <<: *app-small
    image: pinda/pd-web-manager:${PD_WEB_MANAGER_TAG:-${TAG:-latest}}
    container_name: pd-web-manager
    restart: unless-stopped
    ports: ["8161:8161"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8161' || exit 1"]
    environment:
      <<: [*jvm-small, *nacos-env, *redis-env, *baidu-env]

  pd-web-driver:
    <<: *app-small
    image: pinda/pd-web-driver:${PD_WEB_DRIVER_TAG:-${TAG:-latest}}
    container_name: pd-web-driver
    restart: unless-stopped
    ports: ["8162:8162"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8162' || exit 1"]
    environment:
      <<: [*jvm-small, *nacos-env, *redis-env, *baidu-env]

  pd-web-courier:
    <<: *app-small
    image: pinda/pd-web-courier:${PD_WEB_COURIER_TAG:-${TAG:-latest}}
    container_name: pd-web-courier
    restart: unless-stopped
    ports: ["8163:8163"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8163' || exit 1"]
    environment:
      <<: [*jvm-small, *nacos-env, *redis-env]

  pd-web-customer:
    <<: *app-small
    image: pinda/pd-web-customer:${PD_WEB_CUSTOMER_TAG:-${TAG:-latest}}
    container_name: pd-web-customer
    restart: unless-stopped
    ports: ["8164:8164"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8164' || exit 1"]
    environment:
      <<: [*jvm-small, *nacos-env, *redis-env, *baidu-env]

  # ============================================================
  #  4 端前端（容器名按业务角色命名，端口自 2026-10-09 起固定，不再变动）
  # ============================================================
  #  端            容器名           端口   对应后端聚合层        状态
  #  后台管理      pd-admin-h5      8081   pd-web-manager:8161   Vue3 已就位
  #  司机端        pd-driver-h5     8082   pd-web-driver:8162    uniapp 已就位
  #  快递员端      pd-courier-h5    8083   pd-web-courier:8163   占位，待代码
  #  客户小程序    pd-customer-h5   8084   pd-web-customer:8164  占位，待代码
  #
  #  业务角色取自 docs/03-功能规划与需求说明.md 的「三端移动应用」：
  #  司机端 / 快递员端 / 客户小程序，加后台管理共 4 端。
  # ============================================================

  # ---------- 后台管理（Vue3 + Vite） ----------
  # 替代老 React 版后台（2026-10-09 下线：容器停用、镜像删除、git 取消跟踪，代码仅存本地）。
  # 端口 8081：老后台曾占用 8080，下线后不沿用，避免与历史书签/监控混淆。
  pd-admin-h5:
    <<: *app-static
    image: pinda/pd-admin-h5:${PD_ADMIN_H5_TAG:-${TAG:-latest}}
    container_name: pd-admin-h5
    restart: unless-stopped
    ports: ["8081:80"]
    healthcheck:
      <<: *hc-common
      # 容器内监听 80，宿主机才是 8081
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80' || exit 1"]
    environment:
      # server_name，容器间/内网访问用
      NGINX_HOST: 192.168.20.130
      # nginx 将 /prod-api 反代到网关。
      # 走 compose 同网络服务名 pd-gateway（容器间直连），不用宿主 eth0 IP
      # ——容器内访问宿主 bridge IP会被防火墙拦（实测超时）。
      DOCKER_REQUEST_DOMAIN_PREFIX: http://pd-gateway:8760

  # ---------- 司机端（uniapp H5，8082） ----------
  # 只有 H5 产物走 nginx 托管；微信小程序与 App 打包产物不走这里。
  pd-driver-h5:
    <<: *app-static
    image: pinda/pd-driver-h5:${PD_DRIVER_H5_TAG:-${TAG:-latest}}
    container_name: pd-driver-h5
    restart: unless-stopped
    ports: ["8082:80"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80' || exit 1"]
    environment:
      NGINX_HOST: 192.168.20.130
      DOCKER_REQUEST_DOMAIN_PREFIX: http://pd-gateway:8760

  # ---------- 快递员端（uniapp H5，8083，占位待代码） ----------
  # 代码尚未提供，先用占位镜像把端口和网络占住，避免将来代码就位时撞端口。
  # 代码就位后替换方式（端口保持不变，只换 image）：
  #   docker build -f deploy/apps/Dockerfile.mobile-h5 \
  #     --build-arg APP_PATH=<uniapp项目目录> --build-arg BUILD_CMD=build:h5 \
  #     --build-arg DIST_SUBDIR=build/h5 -t pinda/pd-courier-h5:<tag> .
  # 判定"该端已就位"：docker ps 里 8083 对应的镜像不再是 pinda/placeholder
  pd-courier-h5:
    <<: *app-static
    image: pinda/pd-courier-h5:${PD_COURIER_H5_TAG:-${TAG:-latest}}
    container_name: pd-courier-h5
    restart: unless-stopped
    ports: ["8083:80"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80' || exit 1"]
    environment:
      NGINX_HOST: 192.168.20.130
      DOCKER_REQUEST_DOMAIN_PREFIX: http://pd-gateway:8760

  # ---------- 客户小程序（uniapp H5，8084，占位待代码） ----------
  # 同上，代码就位后只换 image。
  pd-customer-h5:
    <<: *app-static
    image: pinda/pd-customer-h5:${PD_CUSTOMER_H5_TAG:-${TAG:-latest}}
    container_name: pd-customer-h5
    restart: unless-stopped
    ports: ["8084:80"]
    healthcheck:
      <<: *hc-common
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80' || exit 1"]
    environment:
      NGINX_HOST: 192.168.20.130
      DOCKER_REQUEST_DOMAIN_PREFIX: http://pd-gateway:8760

