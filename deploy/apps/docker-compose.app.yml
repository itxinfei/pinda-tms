      # netty 实体表(pd_alarm_record/pd_truck_location/pd_truck_location_archive)实际落在 pd_oms 库
      SPRING_DATASOURCE_DRUID_URL: "jdbc:mysql://192.168.20.130:3306/pd_oms?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true"

  pd-druid:
    <<: *app-small
    image: pinda/pd-druid:${PD_DRUID_TAG:-${TAG:-latest}}
    container_name: pd-druid
    restart: unless-stopped
