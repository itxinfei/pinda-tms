# ============================================
# 新版后台管理系统（Vue3）容器内 nginx 配置
#
# 由 nginx 官方镜像的 docker-entrypoint 通过 envsubst 渲染以下变量：
#   ${NGINX_HOST}                     对外访问用的 server_name
#   ${DOCKER_REQUEST_DOMAIN_PREFIX}   网关地址，容器间直连
#
# 三处关键设计（都是踩过坑的）：
#
# 1. resolver 127.0.0.11 + 变量形式的 proxy_pass
#    直接写 proxy_pass http://pd-gateway:8760 时，nginx 只在启动那一刻解析一次并缓存。
#    网关容器重建换 IP 后，前端仍连旧地址 → connection refused → 502
#    （实测踩过：upstream 指向 172.21.0.2，而 DNS 已指向 172.21.0.12）。
#    127.0.0.11 是 Docker 内置 DNS；proxy_pass 带变量后必须自己带上 URI 部分。
#
# 2. location /prod-api 只「剥掉 /prod-api 前缀」再转发
#    前端 .env.production 里 VITE_API_BASE=/prod-api，且代码内 url 已带 /api，
#    打包后浏览器请求 /prod-api/api/auth/anno/captcha；网关真实路径是 /api/auth/anno/captcha。
#    故 rewrite 只剥 /prod-api、保留其后的 /api 段（切勿再补 /api，否则会变成
#    /api/api/... 命中不了网关白名单，验证码/登录返回 401，2026-10-10 实测修复）。
#
# 3. try_files ... /index.html（SPA fallback）
#    vue-router 用 history 模式，直接访问或刷新 /system/user 这类子路由时，
#    磁盘上没有对应文件，nginx 默认返回 404。加上 fallback 交回 index.html，
#    由前端路由接管。老版后台（React + hash 模式）没这个问题，新版必须加。
# ============================================

server {
    listen       80;
    server_name  ${NGINX_HOST};

    charset utf-8;
    client_max_body_size 50m;

    # 容器内 nginx 的日志统一走标准输出，由 docker logs 收集
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/x-javascript text/javascript image/svg+xml;
    # 单个静态资源最大-age 一年，靠文件名 hash 换版本
    gzip_proxied expired no-cache no-store private auth;

    # ---------- 前端静态资源 ----------
    location / {
        root   /usr/share/nginx/html;
        index  index.html;

        # SPA history 模式 fallback：子路由刷新不 404
        try_files $uri $uri/ /index.html;

        # index.html 不缓存：发布后浏览器刷新立即拿到新版本（避免菜单点旧 JS）
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }

        # 带 hash 的静态资源可永久缓存（文件名变即内容变）
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
            try_files $uri =404;
        }
    }

    # vite 构建期写入的版本号文件，供前端做版本比对/强制刷新提示
    # root 必须显式写：本 location 与 location / 平级（不在其嵌套内），不写会落到
    # nginx 默认 /etc/nginx/html → 实测 404 "open() /etc/nginx/html/version.json failed"。
    location = /version.json {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ---------- 后端 API 反代 ----------
    # 浏览器请求 /prod-api/api/...，这里只需剥掉 /prod-api 前缀，保留其后的 /api 段发给网关。
    #
    # 为什么用 rewrite 而不是 proxy_pass 带 URI：
    #   proxy_pass 里一旦出现变量，nginx 就不再做「location 前缀 → proxy_pass URI」的替换
    #   （那是无变量时才有的行为）。
    # rewrite ... break 在 rewrite 阶段就把 $uri 改好，proxy_pass 只负责发出去，行为确定。
    location /prod-api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream ${DOCKER_REQUEST_DOMAIN_PREFIX};

        # /prod-api/api/authority/x -> /api/authority/x
        rewrite ^/prod-api/(.*)$ /$1 break;

        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        # 长连接：netty 推送 / 大报表导出都可能长时间无响应，超时给足
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 不带 URI 部分：直接发 rewrite 后的 $uri
        proxy_pass $api_upstream;
    }

    # websocket / SSE 升级（netty 推送通道）
    location /ws {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ws_upstream ${DOCKER_REQUEST_DOMAIN_PREFIX};

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass $ws_upstream$request_uri;
    }
}
