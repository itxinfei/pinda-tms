# ============================================
# uniapp H5 版容器内 nginx 配置
#
# 与后台管理系统的差异：
#   - API 前缀走 /prod-api（与 pd-admin-h5 保持一致，网关同一套）
#   - H5 产物在子目录（uniapp 输出到 build/h5，构建阶段已拷到根），此处同后台
#
# 关键点：
#   1. resolver 127.0.0.11 + 变量 proxy_pass：网关容器重建换 IP 后不 502，
#      原因见 deploy/apps/nginx/admin-ui-vue3.conf 的注释。
#   2. try_files fallback：uniapp H5 也是 hash/history 路由，刷新子页不 404。
# ============================================

server {
    listen       80;
    server_name  ${NGINX_HOST};

    charset utf-8;
    # 小程序/APP 上传可能带大文件，额度放宽
    client_max_body_size 50m;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/x-javascript text/javascript image/svg+xml;
    gzip_proxied expired no-cache no-store private auth;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;

        # SPA fallback，刷新子路由不 404
        try_files $uri $uri/ /index.html;

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
            try_files $uri =404;
        }
    }

    # root 显式写出：与 location / 平级而非嵌套，漏写会落到
    # nginx 默认 /etc/nginx/html 而 404（同 admin-h5.conf 修复前教训）。
    location = /version.json {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ---------- 后端 API 反代 ----------
    # 前端打 /prod-api/*，网关认 /api/*，这里把前缀换掉再转发。
    # 用 rewrite 而非 proxy_pass $api/api/：proxy_pass 带变量时 nginx 不做前缀替换，
    # 实测会把路径截成 /api/（丢掉后面的段）导致 404。详见 admin-ui-vue3.conf 的注释。
    location /prod-api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream ${DOCKER_REQUEST_DOMAIN_PREFIX};

        rewrite ^/prod-api/(.*)$ /api/$1 break;

        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_pass $api_upstream;
    }

    location /ws {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ws_upstream ${DOCKER_REQUEST_DOMAIN_PREFIX};

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass $ws_upstream$request_uri;
    }
}
