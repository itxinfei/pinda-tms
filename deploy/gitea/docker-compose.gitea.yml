# ============================================
# 品达TMS DevOps 组件：Gitea（Git 仓库）+ act_runner（Gitea Actions 执行器）
# 启动：
#   1) 先只启动 gitea：docker compose -f deploy/gitea/docker-compose.gitea.yml up -d gitea
#   2) 在 Gitea「管理面板 -> Actions -> Runners -> Create Runner」获取注册令牌
#   3) 把令牌填入下面 GITEA_RUNNER_REGISTRATION_TOKEN，再：
#      docker compose -f deploy/gitea/docker-compose.gitea.yml up -d
# ============================================
name: pinda-devops

services:
  gitea:
    image: gitea/gitea:1.21
    container_name: gitea
    restart: unless-stopped
    ports:
      - "3000:3000"   # Web 与 git http
      - "2222:22"     # git ssh（避开宿主机 22）
    volumes:
      - /data/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - USER_UID=1000
      - USER_GID=1000
      # 内置 SQLite，免外部数据库；INSTALL_LOCK=true 跳过首次 Web 安装向导
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/data/gitea.db
      - GITEA__server__INSTALL_LOCK=true
      - GITEA__server__DOMAIN=192.168.20.130
      - GITEA__server__ROOT_URL=http://192.168.20.130:3000/
      - GITEA__server__SSH_PORT=2222
      # 关闭自助注册，避免未经授权的账号
      - GITEA__service__DISABLE_REGISTRATION=true

  act_runner:
    image: gitea/act_runner:latest
    container_name: act_runner
    restart: unless-stopped
    depends_on:
      - gitea
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # job 中可操作宿主机 Docker
      - /data/runner/config.yaml:/config.yaml
      - /data/runner/data:/data                    # 注册标记与工作目录持久化
      - /data/m2:/root/.m2                         # Maven 依赖缓存，加速重复构建
    environment:
      - GITEA_INSTANCE_URL=http://192.168.20.130:3000
      # 首次启动前填入从 Gitea 获取的 Runner 注册令牌
      - GITEA_RUNNER_REGISTRATION_TOKEN=
    command: >
      sh -c "
      if [ ! -f /data/.registered ]; then
        act_runner register
          --instance $${GITEA_INSTANCE_URL}
          --token $${GITEA_RUNNER_REGISTRATION_TOKEN}
          --name pinda-runner
          --config /config.yaml
          --no-interactive;
        touch /data/.registered;
      fi;
      act_runner daemon --config /config.yaml
      "
