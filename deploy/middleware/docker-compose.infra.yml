# ============================================
# 品达TMS 中间件编排：MySQL / Redis / Nacos / RabbitMQ
#
# 本文件按 192.168.20.130 上**实际运行**的容器参数还原（docker inspect），
# 此前这些容器由零散 docker run 创建、仓库中无可复现编排，且 docs/部署文档.md 的
# 镜像选择已与实际漂移（seata 运行方式与实际不一致）。
#
# 首次启用必须先迁移数据，否则容器内已有状态会随重建丢失：
#   rabbitmq 原本没有任何挂载卷，nacos 只挂了 logs、
#   内嵌 Derby 配置库留在容器可写层。见本目录 migrate-data.sh。
#
# 启动（迁移完成后）：
#   docker compose -f deploy/middleware/docker-compose.infra.yml up -d
# ============================================
name: pinda-infra

x-ulimits: &ulimits
  ulimits:
    nofile:
      soft: 65535
      hard: 65535

services:
  mysql8:
    image: mysql:8.0
    container_name: mysql8
    restart: unless-stopped
    <<: *ulimits
    ports:
      - "3306:3306"
    volumes:
      - /data/mysql:/var/lib/mysql
    environment:
      # 口令不入库：由同目录 .env 提供（机器上 /data/deploy/middleware/.env，root 0600）。
      # 缺这个文件 compose 会直接报错，不会静默用一个新密码把库改掉。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?缺少 .env 里的 MYSQL_ROOT_PASSWORD}
    # 缓冲池 128M(出厂默认) -> 1G：/data/mysql 数据 231M，原先大部分查询落盘，
    # 与本机单块接近饱和的虚拟盘互相放大；max_connections 151 -> 500，
    # 覆盖 8 个服务各自 Druid max-active=50（合计 400）的最坏情况。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --innodb-buffer-pool-size=1G
      - --max-connections=500
    mem_limit: 2g
    # memory.low（docker 把 reservation 落到 cgroup v2 的 memory.low）：
    # 2026-10-07 实测过 1G 缓冲池里 246M 被换进 swap，表现为查询突然变慢。
    mem_reservation: 1200m
    oom_score_adj: -500
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    <<: *ulimits
    ports:
      - "6379:6379"
    volumes:
      - /data/redis:/data
    # volatile-lru 而非 allkeys-lru：resource 这个 Hash 无 TTL，存的是网关鉴权
    # 用的整张权限资源表，被淘汰会直接打穿权限体系。
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - volatile-lru
    mem_limit: 1536m
    mem_reservation: 256m
    oom_score_adj: -500
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos
    restart: unless-stopped
    <<: *ulimits
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - /data/nacos:/home/nacos/logs
      # 原本只有 logs 被挂出，35 条微服务配置存在容器可写层的内嵌 Derby 里，
      # docker rm nacos 即永久消失。
      - /data/nacos-data:/home/nacos/data
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
      JVM_MS: 128m
      JVM_MMS: 320m
      PREFER_HOST_MODE: ip
      FUNCTION_MODE: all
      TOMCAT_ACCESSLOG_ENABLED: "false"
    mem_limit: 1g
    mem_reservation: 512m
    oom_score_adj: -500
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8848/nacos/v1/ns/operator/metrics || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    # Beam 的节点名由 hostname 推导(rabbit@<hostname>)。钉死它，重建后节点名才稳定。
    hostname: rabbitmq
    restart: unless-stopped
    <<: *ulimits
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      # 挂整个 /var/lib/rabbitmq 而不是只挂 mnesia：.erlang.cookie 在父目录里，
      # 只挂 mnesia 会让重建后的节点拿到新 cookie、以新节点身份重新加入。
      - /data/rabbitmq:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?缺少 .env 里的 RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?缺少 .env 里的 RABBITMQ_DEFAULT_PASS}
      RABBITMQ_LOGS: "-"
    # RabbitMQ 3.12 废弃了 RABBITMQ_VM_MEMORY_HIGH_WATERMARK 环境变量，
    # 改用 command 里的配置参数设置内存高水位
    # 注意：现有 mnesia 目录名是 rabbit@<旧容器ID>，钉住 hostname 后新节点名为
    # rabbit@rabbitmq，会另起一份空库；旧目录原样留在 /data/rabbitmq/mnesia 下不删，
    # 需要接回时按官方 node_name 改名流程处理即可。当前 5 个队列消息数均为 0，
    # 且 Spring AMQP 连接时会重新声明队列/交换机，因此新节点不丢业务拓扑。
    command: ["rabbitmq-server"]
    mem_limit: 1g
    mem_reservation: 128m
    oom_score_adj: -500
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
