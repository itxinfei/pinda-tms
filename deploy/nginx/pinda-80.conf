# :80 入口不再直出宿主静态目录，统一反代到新版后台容器 pd-admin-h5 (127.0.0.1:8081)
# 静态产物与 /prod-api 都由容器里的 nginx 负责，避免宿主副本与 git 版本不一致
# 注意(2026-10-09): 老 React 后台(pd-admin-ui, 8080)已下线，容器名与端口都变了。
# 另一处坑: 本文件由 deploy/nginx/install-host-80.sh 装到 /etc/nginx/，
# 而宝塔 nginx 读的是 /www/server/nginx/conf/ + /www/server/panel/vhost/nginx/*.conf，
# 两套配置体系不互通——装到 /etc/nginx/ 的配置对宝塔无效（这是"打不开后台"的根因）。
server {
    listen       80 default_server;
    server_name  _;

    charset utf-8;
    client_max_body_size 50m;
    access_log /var/log/nginx/pinda-80.access.log;

    # 部署状态页由 CI 的 deploy-info.sh 生成在宿主上，精确匹配优先于下面的 location /
    location = /deploy.html { root /var/www/deployinfo; default_type text/html; }
    location = /deploy.json { root /var/www/deployinfo; default_type application/json; }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
