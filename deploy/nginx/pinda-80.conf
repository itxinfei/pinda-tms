# :80 入口不再直出宿主静态目录，统一反代到 CI 构建的 pd-admin-ui 容器(127.0.0.1:8080)
# 静态产物与 /api 都由容器里的 nginx 负责，避免宿主副本与 git 版本不一致
server {
    listen       80 default_server;
    server_name  _;

    charset utf-8;
    client_max_body_size 50m;
    access_log /var/log/nginx/pinda-80.access.log;

    # 部署状态页由 CI 的 deploy-info.sh 生成在宿主上，精确匹配优先于下面的 location /
    location = /deploy.html { root /var/www/deployinfo; default_type text/html; }
    location = /deploy.json { root /var/www/deployinfo; default_type application/json; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
