      - NACOS_PORT=8848
      - NACOS_ID=09d0e14f-107f-4fea-8f80-e59e0cc63694
    ports:
      - "8190:8190"
    volumes:
      - ./pd-dispatch/target/pd-dispatch-1.0.0-SNAPSHOT.jar:/app.jar
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
