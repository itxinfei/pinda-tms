      - NACOS_IP=nacos
      - NACOS_PORT=8848
      - NACOS_ID=09d0e14f-107f-4fea-8f80-e59e0cc63694
      - spring.kafka.bootstrap-servers=kafka:9092
    ports:
      - "8192:8192"
    volumes:
      - ./pd-netty/target/pd-netty-1.0.0-SNAPSHOT.jar:/app.jar
