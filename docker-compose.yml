      - NACOS_PORT=8848
      - NACOS_ID=09d0e14f-107f-4fea-8f80-e59e0cc63694
    ports:
      - "8191:8191"
    volumes:
      - ./pd-aggregation/target/pd-aggregation-1.0.0-SNAPSHOT.jar:/usr/src/pd-aggregation-1.0.0.jar
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
