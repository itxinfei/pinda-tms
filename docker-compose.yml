version: '3.8'

# ==================== 基础设施 ====================

services:
  # ---------- Nacos 注册中心 + 配置中心 ----------
  nacos:
    image: nacos/nacos-server:2.0.3
    container_name: pinda-nacos
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - JVM_XMS=256m
      - JVM_XMX=256m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - ./nacos/logs:/home/nacos/logs
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ---------- MySQL ----------
  mysql:
    image: mysql:8.0.20
    container_name: pinda-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
      - TZ=Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ---------- Redis ----------
  redis:
    image: redis:5.0.12-alpine
    container_name: pinda-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------- ZooKeeper (Kafka依赖) ----------
  zookeeper:
    image: zookeeper:3.4.14
    container_name: pinda-zookeeper
    environment:
      - ZOO_MY_ID=1
      - ZOO_SERVERS=server.1=0.0.0.0:2888:3888
    ports:
      - "2181:2181"
      - "2888:2888"
      - "3888:3888"
    volumes:
      - ./zookeeper/data:/tmp/zookeeper
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ---------- Kafka ----------
  kafka:
    image: wurstmeister/kafka:2.13-2.6.0
    container_name: pinda-kafka
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_LOG_DIRS=/kafka/kafka-logs
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_HEAP_OPTS=-Xmx512m -Xms256m
      - TZ=Asia/Shanghai
    ports:
      - "9092:9092"
    volumes:
      - ./kafka/data:/kafka/kafka-logs
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ==================== 微服务 ====================

  # ---------- 网关服务 (pd-gateway) ----------
  pd-gateway:
    build:
      context: ./pd-authority/pd-apps/pd-gateway
      dockerfile: Dockerfile
    container_name: pinda-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_IP=nacos
      - NACOS_PORT=8848
      - NACOS_ID=09d0e14f-107f-4fea-8f80-e59e0cc63694
    ports:
      - "8760:8760"
    volumes:
      - ./pd-authority/pd-apps/pd-gateway/target/pd-gateway-1.0-SNAPSHOT.jar:/app.jar
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------- 权限认证服务 (pd-auth-server) ----------
  pd-auth-server:
    build:
      context: ./pd-authority/pd-apps/pd-auth/pd-auth-server
      dockerfile: Dockerfile
    container_name: pinda-auth
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_IP=nacos
      - NACOS_PORT=8848
      - NACOS_ID=09d0e14f-107f-4fea-8f80-e59e0cc63694
    ports:
      - "9000:9000"
    volumes:
      - ./pd-authority/pd-apps/pd-auth/pd-auth-server/target/pd-auth-server-1.0-SNAPSHOT.jar:/app.jar
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------- 基础数据服务 (pd-base) ----------
  pd-base:
    build:
      context: ./pd-base
      dockerfile: src/main/docker/Dockerfile
    container_name: pinda-base
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_IP=nacos
      - NACOS_PORT=8848
      - NACOS_ID=09d0e14f-107f-4fea-8f80-e59e0cc63694
    ports:
      - "8185:8185"
    volumes:
      - ./pd-base/target/pd-base-1.0.0-SNAPSHOT.jar:/app.jar
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------- 订单服务 (pd-oms) ----------
  pd-oms:
    build:
      context: ./pd-oms
      dockerfile: src/main/docker/Dockerfile
    container_name: pinda-oms
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_IP=nacos
      - NACOS_PORT=8848
      - NACOS_ID=09d0e14f-107f-4fea-8f80-e59e0cc63694
    ports:
      - "8186:8186"
    volumes:
      - ./pd-oms/target/pd-oms-1.0.0-SNAPSHOT.jar:/app.jar
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------- 配送作业服务 (pd-work) ----------
  pd-work:
    build:
      context: ./pd-work
      dockerfile: src/main/docker/Dockerfile
    container_name: pinda-work
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_IP=nacos
      - NACOS_PORT=8848
      - NACOS_ID=09d0e14f-107f-4fea-8f80-e59e0cc63694
    ports:
      - "8187:8187"
    volumes:
      - ./pd-work/target/pd-work-1.0.0-SNAPSHOT.jar:/app.jar
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------- 用户服务 (pd-user) ----------
  pd-user:
    build:
      context: ./pd-user
      dockerfile: src/main/docker/Dockerfile
    container_name: pinda-user
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_IP=nacos
      - NACOS_PORT=8848
      - NACOS_ID=09d0e14f-107f-4fea-8f80-e59e0cc63694
    ports:
      - "8189:8189"
    volumes:
      - ./pd-user/target/pd-user-1.0.0-SNAPSHOT.jar:/app.jar
    depends_on:
      nacos:
        condition: service_healthy
