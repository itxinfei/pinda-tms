        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------- 智能调度服务 (pd-dispatch) ----------
  pd-dispatch:
    build:
      context: ./pd-dispatch
      dockerfile: src/main/docker/Dockerfile
    container_name: pinda-dispatch
    environment:
      - SPRING_PROFILES_ACTIVE=docker
