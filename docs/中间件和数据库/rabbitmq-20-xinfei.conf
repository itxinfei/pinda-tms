# 心飞物流TMS 开发测试机 RabbitMQ 参数（2026-10-09）
# 水位必须写绝对值：RabbitMQ 按宿主机总内存算 relative 水位，
# 0.4 x 15.9G ≈ 6.4G，而本容器 cgroup 上限只有 1G —— 结果是它永不自我流控、
# 先被 cgroup OOM kill。512M 对 1G 容器即 50%。
vm_memory_high_watermark.absolute = 512MB
vm_memory_calculation_strategy = rss
# 磁盘告警线：原 50MB 等于没有保护，数据盘 97G，给 2GB。
disk_free_limit.absolute = 2GB
