server:
  tomcat:
    uri-encoding: UTF-8
    max-threads: 1000
    min-spare-threads: 30
  port: 8191
  connection-timeout: 50000ms

spring:
  application:
    name: pd-aggregation
  # 环境 dev|test|prod|docker
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
  # Spring Cloud 标准接入方式（2026-10-10 R6 演练迁移，取代旧 bootstrap.yml）；
  # SB3/SCA 2025 下 bootstrap 上下文默认关闭，远程配置改由 config.import 拉取；
  # optional 表示远程配置缺失不阻断启动。
  config:
    import:
      - optional:nacos:pd-aggregation.yml
  cloud:
    nacos:
      # 服务注册
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        namespace: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
        group: xinfei-tms
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
      # 配置中心
      config:
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        namespace: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
        group: xinfei-tms
        file-extension: yml
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
  # 数据源：单库 pinda_tms（本模块 pom 直接依赖 druid-spring-boot-3-starter，数据源本地声明，
  # 口径对齐 pd-work/pd-oms 单库多租户标准模式。Nacos pd-aggregation.yml 仅存的
  # spring.datasource.db-name 键在本模块无消费者，属待清理残留）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:192.168.20.130}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:pinda_tms}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: ASSIGN_ID
