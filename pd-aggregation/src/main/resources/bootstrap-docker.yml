# Docker 环境专用配置
# 指向容器内的 Nacos 服务
spring:
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:123456}
      discovery:
        server-addr: nacos:8848
        group: pinda-tms
        namespace: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
      config:
        server-addr: nacos:8848
        file-extension: yml
        group: pinda-tms
        namespace: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
