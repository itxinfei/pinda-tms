pinda:
  # docker部署时，需要指定， 表示运行该服务的宿主机IP
  local-ip: ${LOCAL_IP:${spring.cloud.client.ip-address}}
  nacos:
    ip: ${NACOS_IP:@pom.nacos.ip@}
    port: ${NACOS_PORT:@pom.nacos.port@}
    namespace: ${NACOS_ID:@pom.nacos.namespace@}

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: @project.artifactId@ #pd-gateway
  profiles:
    active: prod #@pom.profile.name@ （统一 prod；Nacos 地址由 NACOS_IP 环境变量注入 192.168.20.130）
  cloud:
    nacos:
      config:
        server-addr: ${pinda.nacos.ip}:${pinda.nacos.port}
        file-extension: yml
        group: pinda-tms
        namespace: ${pinda.nacos.namespace}
        shared-dataids: common.yml, redis.yml, mysql.yml
        refreshable-dataids: common.yml
        enabled: true
      discovery:
        server-addr: ${pinda.nacos.ip}:${pinda.nacos.port}
        group: pinda-tms
        namespace: ${pinda.nacos.namespace}
        metadata:
          management.context-path: ${server.servlet.context-path:}${spring.mvc.servlet.path:}${management.endpoints.web.base-path:}
          #http://localhost:8760/api/gate/actuator
logging:
  level:
    root: debug

# j2cache L2 显式兜底(与pd-auth-server一致): 容器内127.0.0.1是容器自身,
# 中间件均在宿主192.168.20.130, host来自compose注入的环境变量REDIS_HOST
j2cache:
  lettuce:
    mode: single
    hosts: ${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}


