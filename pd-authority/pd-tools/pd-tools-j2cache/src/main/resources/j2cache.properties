# j2cache.properties - 显式覆盖 j2cache 核心库自带的默认配置(127.0.0.1:6379)
# nacos redis.yml 的 j2cache.config-location 指向 classpath:j2cache.properties,
# Spring @PropertySource 会加载本文件(classpath根优先于依赖库), 键为扁平格式(无j2cache.前缀)
# host/port 来自容器环境变量 REDIS_HOST/REDIS_PORT, 容器化部署由 compose 注入
lettuce.mode=single
lettuce.storage=generic
lettuce.channel=j2cache
lettuce.scheme=redis
lettuce.hosts=${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}
lettuce.password=
lettuce.database=0
lettuce.maxTotal=100
lettuce.maxIdle=10
lettuce.minIdle=10
lettuce.timeout=10000
# 2026-10-06 修复: FST 序列化不支持 java.time.LocalDateTime(Menu/Resource 等实体缓存时
# "cannot support legacy JDK serialization methods in crossplatform mode" 崩溃)
# nacos redis.yml 的 j2cache 段不会覆盖本文件(SpringJ2CacheConfigUtil 第二段仅当 L1/L2 为空时合并),
# 故此处显式声明。实体均 implements Serializable, 使用 JDK 序列化。
serialization=java
