server:
  tomcat:
    uri-encoding: UTF-8
    max-threads: 1000
    min-spare-threads: 30
  port: 8190
  connection-timeout: 50000ms

spring:
  application:
    name: pd-dispatch
  # 环境 dev|test|prod|docker；容器镜像由 src/main/docker/Dockerfile 的 CMD 显式指定 docker
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
  # JDK 21 虚拟线程：Tomcat 请求处理与阻塞式 Feign 调用改跑虚拟线程，免调平台线程池
  threads:
    virtual:
      enabled: true
  # 2026-10-10：SB3.5/SCA2025 下 bootstrap 上下文默认关闭，bootstrap*.yml 不再被加载；
  # 远程配置改由 config.import 接入，姿势对齐已上线的 pd-auth。optional = 远程缺失不阻断启动。
  config:
    import:
      - optional:nacos:pd-dispatch.yml
  cloud:
    openfeign:
      circuitbreaker:
        # Feign 熔断降级总开关（实现为 Resilience4j；各 XxxFeignFallback 由此生效）
        enabled: true
    # 关闭 Resilience4j 执行层的线程切换，保证系统态调度租户透传。
    # 现象：XXL 系统态调度线程已把租户写入 TenantContextHolder（普通 ThreadLocal），但 Feign 真实调用
    # （含出站 RequestInterceptor）被 submit 到隔离线程池执行，ThreadLocal 不传播，
    # InternalAuthRequestInterceptor 在池化线程读不到租户→不带 tenantId 头→下游 pd-oms 跨 JVM
    # 只能读入站头，缺失回落租户 0，SQL 拼 tenant_id=0，调度分类恒查不到 status=4 的租户订单。
    #
    # spring-cloud-circuitbreaker-resilience4j 3.3.0 字节码逐层坐实（2026-10-12 联调）：
    # 1) Resilience4JCircuitBreakerFactory 4 参构造器恒建 cachedThreadPool 作为默认 executorService；
    # 2) 仅关 TimeLimiter 不够：run() 的 executorService 非空分支里，orElse 选中的 callable 仍执行
    #    supplier.get()→executorService.submit(原始调用)（lambda$run$4/6），TimeLimiter 开关只决定
    #    是否叠加超时装饰，不阻止 submit，真实调用仍跑在 pool-N-thread 线程；
    # 3) 本服务 fat jar 缺 resilience4j-bulkhead-2.2.0.jar，Resilience4jBulkheadProvider 自动配置回退、
    #    容器内唯一 Factory 的 bulkheadProvider=null，故 enable-semaphore-default-bulkhead 是空转开关；
    # 4) 唯一同线程入口：Factory.create() 读 isDisableThreadPool()=true → 走无 ExecutorService 的
    #    8 参构造器（该字段为 null）→ run() 命中纯 CircuitBreaker.decorateSupplier 分支，调用留在
    #    调度 JobThread 同线程，失败率熔断与各 FeignFallback 完整保留。
    # 超时仍由 Feign 自身连接/读取超时兜底；仅作用于本服务（pd-web 各端默认未开 Feign 熔断，不走此层）。
    circuitbreaker:
      resilience4j:
        # 关键开关：不为每个断路器注入线程池，Feign 调用同线程同步执行，ThreadLocal 租户正常透传
        disable-thread-pool: true
        # 线程池关闭后 TimeLimiter 无执行载体，一并关闭（信号量/无池模式与 TimeLimiter 不兼容）
        disable-time-limiter: true
        # 保留信号量意向配置：当前 fat jar 缺 resilience4j-bulkhead 依赖，此项空转无害；
        # 将来补齐依赖后自动生效为信号量隔离（不切线程），勿改回默认 ThreadPoolBulkhead
        enable-semaphore-default-bulkhead: true
    nacos:
      # 服务注册
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        namespace: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
        group: xinfei-tms
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
      # 配置中心
      config:
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        namespace: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
        group: xinfei-tms
        file-extension: yml
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
  # jackson 时间格式化（原自引用占位符，值取自 Nacos common.yml 的现网口径）
  jackson:
    time-zone: ${JACKSON_TIME_ZONE:GMT+8}
    date-format: ${JACKSON_DATE_FORMAT:yyyy-MM-dd HH:mm:ss}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:100MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:1000MB}
  # 数据源：单库 pinda_tms（2026-10-10 建库口径 = 八域前缀 + tenant_id 多租户）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:192.168.20.130}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:pinda_tms}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      pool-prepared-statements: false
      max-pool-prepared-statement-per-connection-size: 20
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      stat-view-servlet:
        enabled: false
        url-pattern: /druid/*
      filter:
        stat:
          log-slow-sql: true
          slow-sql-millis: 5000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
  # Redis（本模块引入 sa-token-redis-jackson，登录态与会话需落 Redis）
  # 口径对齐已上线的 pd-auth / pd-gateway；Boot3 下键名为 spring.data.redis.*
  data:
    redis:
      host: ${REDIS_HOST:192.168.20.130}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:123456}

# Sa-Token：pd-dispatch 无外部登录态，此处仅用于服务间 Same-Token 出站签发（OrgFeign 调 pd-auth
# /internal/** 会被 Same-Token 强校验）。token-name 必须与 pd-auth/pd-gateway 一致为 token：
# Same-Token 在未配 secret-key 时走 Redis 共享变量模式，键前缀取 token-name；用默认值 satoken
# 会使 pd-dispatch 写 satoken:var:same-token、pd-auth 读 token:var:same-token，两值不一致恒 401，
# 调度线程的机构→租户反查因此 fallback 回落 tenant_id=0，查不到业务租户订单（新订单数 0）。
sa-token:
  token-name: token

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.xinfei.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    call-setters-on-nulls: false
    jdbc-type-for-null: NULL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
      # 逻辑删除口径 = 建表注释 '0未删 1已删'（docs/mysql/重构v2/*.sql）
      logic-delete-value: 1
      logic-not-delete-value: 0

# 调度重试参数（业务级：机构调度执行失败时的重试，区别于 XXL-Job 平台级调度）
schedule:
  retry:
    # 最大尝试次数（含首次），3 表示首次 + 2 次重试
    max-attempts: ${SCHEDULE_RETRY_MAX_ATTEMPTS:3}
    # 重试间隔（毫秒）
    interval-ms: ${SCHEDULE_RETRY_INTERVAL_MS:2000}

# XXL-Job 执行器（2026-10-10 调度改造：替代自研 Quartz/@Scheduled，控制台见《56-中间件信息总表》§2）
# 定时触发/开关/频率统一由 admin 控制台「心飞调度中心」分组管理，服务侧只保留业务重试参数
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN:http://192.168.20.130:8090/xxl-job-admin}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:}
    executor:
      appname: pinda-dispatch
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      logpath: ${user.home}/logs/xxl-job/pd-dispatch
      logretentiondays: 7

# 短信通知网关（可选，配置后推送订单通知到外部短信网关）
sms:
  # 启用渠道: http-通用网关 aliyun-阿里云 tencent-腾讯云 huawei-华为云 device-设备接口
  active-channel: ${SMS_CHANNEL:http}
  # 通用 HTTP 网关地址（默认通道，兼容原 webhook-url 配置）
  webhook-url: ${SMS_WEBHOOK_URL:}
  channel:
    http:
      # 通用 HTTP 短信网关地址（自建网关/第三方聚合）
      url: ${SMS_HTTP_URL:${SMS_WEBHOOK_URL:}}
    aliyun:
      access-key-id: ${SMS_ALIYUN_ACCESS_KEY_ID:}
      access-key-secret: ${SMS_ALIYUN_ACCESS_KEY_SECRET:}
      sign-name: ${SMS_ALIYUN_SIGN_NAME:心飞物流}
      template-code: ${SMS_ALIYUN_TEMPLATE_CODE:}
    tencent:
      secret-id: ${SMS_TENCENT_SECRET_ID:}
      secret-key: ${SMS_TENCENT_SECRET_KEY:}
      sdk-app-id: ${SMS_TENCENT_SDK_APP_ID:}
      sign-name: ${SMS_TENCENT_SIGN_NAME:心飞物流}
      template-id: ${SMS_TENCENT_TEMPLATE_ID:}
    huawei:
      app-key: ${SMS_HUAWEI_APP_KEY:}
      app-secret: ${SMS_HUAWEI_APP_SECRET:}
      sign-name: ${SMS_HUAWEI_SIGN_NAME:心飞物流}
      template-id: ${SMS_HUAWEI_TEMPLATE_ID:}
    device:
      # 通用设备短信接口地址（短信猫/短信池）
      url: ${SMS_DEVICE_URL:}
      token: ${SMS_DEVICE_TOKEN:}
