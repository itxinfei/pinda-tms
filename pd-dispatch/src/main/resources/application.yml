server:
  tomcat:
    uri-encoding: UTF-8
    max-threads: 1000
    min-spare-threads: 30
  port: 8190
  connection-timeout: 50000ms

spring:
  application:
    name: pd-dispatch
  # 环境 dev|test|prod|docker；容器镜像由 src/main/docker/Dockerfile 的 CMD 显式指定 docker
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
  # JDK 21 虚拟线程：Tomcat 请求处理与阻塞式 Feign 调用改跑虚拟线程，免调平台线程池
  threads:
    virtual:
      enabled: true
  # 2026-10-10：SB3.5/SCA2025 下 bootstrap 上下文默认关闭，bootstrap*.yml 不再被加载；
  # 远程配置改由 config.import 接入，姿势对齐已上线的 pd-auth。optional = 远程缺失不阻断启动。
  config:
    import:
      - optional:nacos:pd-dispatch.yml
  cloud:
    openfeign:
      circuitbreaker:
        # Feign 熔断降级总开关（实现为 Resilience4j；各 XxxFeignFallback 由此生效）
        enabled: true
    # 关闭 Resilience4j TimeLimiter 的独立线程池执行。
    # 默认 TimeLimiter 会把 Feign 真实调用（含出站 RequestInterceptor）submit 到独立线程池，
    # 调用线程只在 future.get 等待；系统态调度线程写入 TenantContextHolder 的租户是普通 ThreadLocal，
    # 切换到池化线程后丢失，InternalAuthRequestInterceptor 读不到租户→不带 tenantId 头→下游 pd-oms
    # 跨 JVM 只能读入站头，缺失回落租户0，SQL 拼 tenant_id=0，调度分类恒查不到 status=4 的租户订单。
    # 关闭后 Feign 在调用线程同步执行，租户/RequestContextHolder 正常透传；失败率熔断与 fallback 不受影响，
    # 超时仍由 Feign 自身连接/读取超时兜底。仅作用于本服务（pd-web 各端默认未开 Feign 熔断，不走此层）。
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true
        # 默认 Bulkhead 是 ThreadPoolBulkhead：会把 Feign 真实调用 submit 到隔离线程池，
        # 与 TimeLimiter 一样切断普通 ThreadLocal——即便上面关了 TimeLimiter，系统态调度线程
        # 写入 TenantContextHolder 的租户仍会在 bulkhead 池化线程丢失，InternalAuthRequestInterceptor
        # 不带 tenantId 头，下游 pd-oms 回落租户 0（spring-cloud-circuitbreaker-resilience4j 3.3.0
        # 字节码坐实：Resilience4jBulkheadProvider.decorateCallable 默认走
        # ThreadPoolBulkhead.decorateCallable(...).get().toCompletableFuture().get()）。
        # 改为信号量隔离：仅 acquire/release 许可、不切线程，Feign 调用留在调度 JobThread 同线程，
        # 租户正常透传。信号量 Bulkhead 与 TimeLimiter 不兼容，故与 disable-time-limiter 配套；
        # 失败率熔断与各 FeignFallback 不受影响，最大并发默认 25（dev 调度足够）。
        enable-semaphore-default-bulkhead: true
    nacos:
      # 服务注册
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        namespace: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
        group: pinda-tms
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
      # 配置中心
      config:
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        namespace: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
        group: pinda-tms
        file-extension: yml
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
  # jackson 时间格式化（原自引用占位符，值取自 Nacos common.yml 的现网口径）
  jackson:
    time-zone: ${JACKSON_TIME_ZONE:GMT+8}
    date-format: ${JACKSON_DATE_FORMAT:yyyy-MM-dd HH:mm:ss}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:100MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:1000MB}
  # 数据源：单库 pinda_tms（2026-10-10 建库口径 = 八域前缀 + tenant_id 多租户）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:192.168.20.130}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:pinda_tms}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      pool-prepared-statements: false
      max-pool-prepared-statement-per-connection-size: 20
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      stat-view-servlet:
        enabled: false
        url-pattern: /druid/*
      filter:
        stat:
          log-slow-sql: true
          slow-sql-millis: 5000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
  # Redis（本模块引入 sa-token-redis-jackson，登录态与会话需落 Redis）
  # 口径对齐已上线的 pd-auth / pd-gateway；Boot3 下键名为 spring.data.redis.*
  data:
    redis:
      host: ${REDIS_HOST:192.168.20.130}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:123456}

# Sa-Token：pd-dispatch 无外部登录态，此处仅用于服务间 Same-Token 出站签发（OrgFeign 调 pd-auth
# /internal/** 会被 Same-Token 强校验）。token-name 必须与 pd-auth/pd-gateway 一致为 token：
# Same-Token 在未配 secret-key 时走 Redis 共享变量模式，键前缀取 token-name；用默认值 satoken
# 会使 pd-dispatch 写 satoken:var:same-token、pd-auth 读 token:var:same-token，两值不一致恒 401，
# 调度线程的机构→租户反查因此 fallback 回落 tenant_id=0，查不到业务租户订单（新订单数 0）。
sa-token:
  token-name: token

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.itheima.pinda.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    call-setters-on-nulls: false
    jdbc-type-for-null: NULL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
      # 逻辑删除口径 = 建表注释 '0未删 1已删'（docs/mysql/重构v2/*.sql）
      logic-delete-value: 1
      logic-not-delete-value: 0

# 调度重试参数（业务级：机构调度执行失败时的重试，区别于 XXL-Job 平台级调度）
schedule:
  retry:
    # 最大尝试次数（含首次），3 表示首次 + 2 次重试
    max-attempts: ${SCHEDULE_RETRY_MAX_ATTEMPTS:3}
    # 重试间隔（毫秒）
    interval-ms: ${SCHEDULE_RETRY_INTERVAL_MS:2000}

# XXL-Job 执行器（2026-10-10 调度改造：替代自研 Quartz/@Scheduled，控制台见《56-中间件信息总表》§2）
# 定时触发/开关/频率统一由 admin 控制台「品达调度中心」分组管理，服务侧只保留业务重试参数
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN:http://192.168.20.130:8090/xxl-job-admin}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:}
    executor:
      appname: pinda-dispatch
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      logpath: ${user.home}/logs/xxl-job/pd-dispatch
      logretentiondays: 7

# 短信通知网关（可选，配置后推送订单通知到外部短信网关）
sms:
  # 启用渠道: http-通用网关 aliyun-阿里云 tencent-腾讯云 huawei-华为云 device-设备接口
  active-channel: ${SMS_CHANNEL:http}
  # 通用 HTTP 网关地址（默认通道，兼容原 webhook-url 配置）
  webhook-url: ${SMS_WEBHOOK_URL:}
  channel:
    http:
      # 通用 HTTP 短信网关地址（自建网关/第三方聚合）
      url: ${SMS_HTTP_URL:${SMS_WEBHOOK_URL:}}
    aliyun:
      access-key-id: ${SMS_ALIYUN_ACCESS_KEY_ID:}
      access-key-secret: ${SMS_ALIYUN_ACCESS_KEY_SECRET:}
      sign-name: ${SMS_ALIYUN_SIGN_NAME:品达物流}
      template-code: ${SMS_ALIYUN_TEMPLATE_CODE:}
    tencent:
      secret-id: ${SMS_TENCENT_SECRET_ID:}
      secret-key: ${SMS_TENCENT_SECRET_KEY:}
      sdk-app-id: ${SMS_TENCENT_SDK_APP_ID:}
      sign-name: ${SMS_TENCENT_SIGN_NAME:品达物流}
      template-id: ${SMS_TENCENT_TEMPLATE_ID:}
    huawei:
      app-key: ${SMS_HUAWEI_APP_KEY:}
      app-secret: ${SMS_HUAWEI_APP_SECRET:}
      sign-name: ${SMS_HUAWEI_SIGN_NAME:品达物流}
      template-id: ${SMS_HUAWEI_TEMPLATE_ID:}
    device:
      # 通用设备短信接口地址（短信猫/短信池）
      url: ${SMS_DEVICE_URL:}
      token: ${SMS_DEVICE_TOKEN:}
