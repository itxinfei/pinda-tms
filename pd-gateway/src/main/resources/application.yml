server:
  port: 8760

spring:
  application:
    name: pd-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Spring Cloud 标准接入方式（取代旧 bootstrap.yml）；optional 表示远程配置缺失不阻断启动。
  # 2026-10-10 修复：dataId 扩展名与 Nacos 实际配置对齐（pd-gateway.yml，原 .yaml 不匹配导致远程配置未被加载）
  config:
    import:
      - optional:nacos:pd-gateway.yml
  cloud:
    nacos:
      # 服务注册
      discovery:
        # 变量名与 deploy/apps/docker-compose.app.yml 的 nacos-env 锚点对齐
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        namespace: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
        group: xinfei-tms
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
      # 配置中心
      config:
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        namespace: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
        group: xinfei-tms
        file-extension: yaml
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
    gateway:
      # 不开启按服务名自动路由，路由显式声明，避免内部服务被意外暴露
      discovery:
        locator:
          enabled: false
      routes:
        # 认证服务：/api/auth/** -> pd-auth，去掉 /api/auth 两段前缀（/api/auth/anno/login -> /anno/login）
        - id: pd-auth
          uri: lb://pd-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=2
        # 系统管理（youlai 契约）：/api/v1/** -> pd-auth，去掉 /api/v1 两段前缀
        # （/api/v1/users -> /users；/api/v1/menus/routes -> /menus/routes）。
        # 同样过网关登录态校验并由网关注入 Same-Token；pd-auth 侧放 controller.v1 包。
        - id: pd-auth-v1
          uri: lb://pd-auth
          predicates:
            - Path=/api/v1/**
          filters:
            - StripPrefix=2
        # 管理端 BFF：/api/manager/** -> pd-web-manager，去掉 /api/manager 两段前缀
        - id: pd-web-manager
          uri: lb://pd-web-manager
          predicates:
            - Path=/api/manager/**
          filters:
            - StripPrefix=2
        # 移动三端 BFF：/api/web-{driver,courier,customer}/** -> 对应 pd-web-*，去掉 /api/web-* 两段前缀
        # 前端 H5 走 /prod-api/web-*（容器 nginx rewrite 成网关 /api/web-*），App/小程序直连 :8760/api/web-*
        - id: pd-web-driver
          uri: lb://pd-web-driver
          predicates:
            - Path=/api/web-driver/**
          filters:
            - StripPrefix=2
        - id: pd-web-courier
          uri: lb://pd-web-courier
          predicates:
            - Path=/api/web-courier/**
          filters:
            - StripPrefix=2
        - id: pd-web-customer
          uri: lb://pd-web-customer
          predicates:
            - Path=/api/web-customer/**
          filters:
            - StripPrefix=2
        # 轨迹/定位服务：/api/netty-service/** -> pd-netty，去掉 /api/netty-service 两段前缀
        # （/api/netty-service/trace/replay -> /trace/replay；/api/netty-service/netty/push -> /netty/push）
        - id: pd-netty
          uri: lb://pd-netty
          predicates:
            - Path=/api/netty-service/**
          filters:
            - StripPrefix=2
  # Redis（Sa-Token 会话 + Same-Token 读取）
  data:
    redis:
      host: ${REDIS_HOST:192.168.20.130}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:123456}

# Sa-Token 配置（与子服务一致，网关据此读取登录态）
sa-token:
  # token 头字段（全端统一）
  token-name: token
  # 有效期 7200 秒
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
