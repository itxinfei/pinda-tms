server:
  tomcat:
    uri-encoding: UTF-8
    max-threads: 1000
    min-spare-threads: 30
  port: 8164
  connection-timeout: 50000ms

spring:
  application:
    name: pd-web-customer
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
  # JDK21 虚拟线程（原 bootstrap.yml 已开启，保留）
  threads:
    virtual:
      enabled: true
  # SB3.5/SCA2025 下 bootstrap 上下文默认关闭，bootstrap*.yml 不再被加载；
  # 远程配置改由 config.import 接入，姿势对齐已上线的 pd-web-manager/pd-oms。optional = 远程缺失不阻断启动。
  config:
    import:
      - optional:nacos:pd-web-customer.yml
  cloud:
    nacos:
      # 服务注册
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        namespace: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
        group: pinda-tms
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
      # 配置中心
      config:
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        namespace: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
        group: pinda-tms
        file-extension: yml
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
    # Feign 熔断总开关（Resilience4j，原 bootstrap.yml 已开启，保留）
    openfeign:
      circuitbreaker:
        enabled: true
    # BFF 在 CompletableFuture 异步线程富化关联档案（车型货型/车辆/线路等关联名），Feign 真实调用
    # 又被 Resilience4j 默认线程池二次 submit 切到池化线程，RequestContextHolder 与
    # AsyncRequestHeaders 异步快照双重丢失→下游回落 tenant=0，富化查询 Total:0、toMap NPE。
    # 注意：本服务 fat jar 缺 resilience4j-bulkhead，enable-semaphore-default-bulkhead 空转；
    # 仅关 TimeLimiter 也不阻止 submit（对齐 pd-dispatch c92fdfe 字节码结论）。唯一有效手段：
    # disable-thread-pool=true 让 Feign 留在 ForkJoinPool 富化线程同线程执行，租户快照正常透传；
    # 熔断与 FeignFallback 不受影响，超时由 Feign 连接/读超时兜底。
    circuitbreaker:
      resilience4j:
        disable-thread-pool: true
        disable-time-limiter: true
        # fat jar 补 resilience4j-bulkhead 依赖后此项才生效（信号量隔离，同样不切线程），先保留意向
        enable-semaphore-default-bulkhead: true
  # RabbitMQ：MailingController 下单后经 pd-common EventPublisher 发布 OrderConfirmedEvent，
  # 供 pd-dispatch 消费驱动调度。此前缺本配置，Spring AMQP 默认连 localhost:5672 → Connection refused。
  # 容器与 pinda-apps 网络隔离、无法用服务名，走宿主机 IP（同 MySQL/Redis），账号密码环境变量注入
  rabbitmq:
    host: ${RABBITMQ_HOST:192.168.20.130}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:pinda}
    password: ${RABBITMQ_PASSWORD:123456}
    virtual-host: ${RABBITMQ_VHOST:/}
  # Redis：BFF 需与网关/pd-auth/pd-netty 接同一个 db0，InternalAuthRequestInterceptor 才能
  # 读到网关签发的 Same-Token（容器内 REDIS_* 由 compose 注入，本地走默认值）
  data:
    redis:
      host: ${REDIS_HOST:192.168.20.130}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:123456}
  # jackson 时间格式化（原自引用占位符，值取自 Nacos common.yml 的现网口径）
  jackson:
    time-zone: ${JACKSON_TIME_ZONE:GMT+8}
    date-format: ${JACKSON_DATE_FORMAT:yyyy-MM-dd HH:mm:ss}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:100MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:1000MB}

# Resilience4j 熔断/超时：SC CircuitBreaker 的 TimeLimiter 默认仅 1s，冷启动首调下游易误判超时。
# 放宽到 10s（同 pd-web-manager），各 Feign 方法未单独配置时统一回退 default。
resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 10s
        cancel-running-future: false

# springdoc 接口文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Sa-Token（BFF 仅作出站 Same-Token 消费方，不注册入站登录拦截器，入站仍由网关负责）
# 关键：token-name 必须与网关/pd-auth 同为 token，Same-Token 的 Redis key 为 token:var:same-token；
# 缺省值是 satoken，会在 BFF 本地自造假令牌导致 /internal/** 被 401。配置口径对齐 pd-netty/pd-auth。
sa-token:
  token-name: token
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 端级角色绑定（X-01 下沉落点，网关只校验登录态）：逗号分隔 OR 关系；
# CUSTOMER 角色码现网暂无（预留，建角色即生效）；ADMIN 并入是因 customer01 等测试账号绑 ADMIN
pinda:
  auth:
    required-roles: CUSTOMER,ADMIN
