server:
  tomcat:
    uri-encoding: UTF-8
    max-threads: 1000
    min-spare-threads: 30
  port: 8162
  connection-timeout: 50000ms

spring:
  application:
    name: pd-web-driver
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
  # JDK21 虚拟线程（原 bootstrap.yml 已开启，保留）
  threads:
    virtual:
      enabled: true
  # SB3.5/SCA2025 下 bootstrap 上下文默认关闭，bootstrap*.yml 不再被加载；
  # 远程配置改由 config.import 接入，姿势对齐已上线的 pd-web-manager/pd-oms。optional = 远程缺失不阻断启动。
  config:
    import:
      - optional:nacos:pd-web-driver.yml
  cloud:
    nacos:
      # 服务注册
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        namespace: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
        group: pinda-tms
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
      # 配置中心
      config:
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        namespace: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
        group: pinda-tms
        file-extension: yml
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
    # Feign 熔断总开关（Resilience4j，原 bootstrap.yml 已开启，保留）
    openfeign:
      circuitbreaker:
        enabled: true
  # jackson 时间格式化（原自引用占位符，值取自 Nacos common.yml 的现网口径）
  jackson:
    time-zone: ${JACKSON_TIME_ZONE:GMT+8}
    date-format: ${JACKSON_DATE_FORMAT:yyyy-MM-dd HH:mm:ss}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:100MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:1000MB}

# Resilience4j 熔断/超时：SC CircuitBreaker 的 TimeLimiter 默认仅 1s，冷启动首调下游易误判超时。
# 放宽到 10s（同 pd-web-manager），各 Feign 方法未单独配置时统一回退 default。
resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 10s
        cancel-running-future: false

# springdoc 接口文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
