server:
  port: 8161

spring:
  application:
    name: pd-web-manager
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
  # JDK21 虚拟线程（原 bootstrap.yml 已开启，保留）
  threads:
    virtual:
      enabled: true
  # SB3.5/SCA2025 下 bootstrap 上下文默认关闭，bootstrap*.yml 不再被加载；
  # 远程配置改由 config.import 接入，姿势对齐已上线的 pd-oms/pd-auth。optional = 远程缺失不阻断启动。
  config:
    import:
      - optional:nacos:pd-web-manager.yml
  cloud:
    nacos:
      # 服务注册
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        namespace: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
        group: xinfei-tms
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
      # 配置中心
      config:
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        namespace: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
        group: xinfei-tms
        file-extension: yml
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
    # Feign 熔断总开关（Resilience4j，原 bootstrap.yml 已开启，保留）
    openfeign:
      circuitbreaker:
        enabled: true
    # 大屏 dashboard 与车型/车辆/线路等档案异步富化：Feign 真实调用被 Resilience4j 默认
    # cachedThreadPool 二次 submit 切到池化线程（pool-N），RequestContextHolder 与
    # AsyncRequestHeaders 异步快照双重丢失→下游回落 tenant=0→面板空、关联名 null。
    # 字节码结论（spring-cloud-circuitbreaker-resilience4j 3.3.0）：enable-semaphore-default-bulkhead
    # 只作用于 BulkheadProvider、disable-time-limiter 走 per-id 判断，均拦不住 submit；
    # 唯一有效手段 disable-thread-pool=true——Factory.create() 走 executorService=null 分支，
    # run() 改纯信号量同线程执行，租户头不丢；熔断与 FeignFallback 原样保留，超时由 Feign 超时兜底。
    circuitbreaker:
      resilience4j:
        disable-thread-pool: true
        disable-time-limiter: true
        # fat jar 补 resilience4j-bulkhead 依赖后此项才生效（信号量隔离，同样不切线程），先保留意向
        enable-semaphore-default-bulkhead: true
  # Redis：BFF 需与网关/pd-auth/pd-netty 接同一个 db0，InternalAuthRequestInterceptor 才能
  # 读到网关签发的 Same-Token（容器内 REDIS_* 由 compose 注入，本地走默认值）
  data:
    redis:
      host: ${REDIS_HOST:192.168.20.130}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:123456}
  # jackson 时间格式化（原自引用占位符，值取自 Nacos common.yml 的现网口径）
  jackson:
    time-zone: ${JACKSON_TIME_ZONE:GMT+8}
    date-format: ${JACKSON_DATE_FORMAT:yyyy-MM-dd HH:mm:ss}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:100MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:1000MB}

# Resilience4j 熔断/超时（Feign circuitbreaker 已开启）
# Spring Cloud CircuitBreaker 的 TimeLimiter 默认超时仅 1s，冷启动首次调用下游时
# 叠加"Nacos 订阅初始化 + 建连 + 下游查询"极易误判超时（无 fallback 的接口直接 500）。
# 开发环境放宽到 10s，各 Feign 方法未单独配置时统一回退此 default 配置。
resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 10s
        cancel-running-future: false

# springdoc 接口文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Sa-Token（BFF 仅作出站 Same-Token 消费方，不注册入站登录拦截器，入站仍由网关负责）
# 关键：token-name 必须与网关/pd-auth 同为 token，Same-Token 的 Redis key 为 token:var:same-token；
# 缺省值是 satoken，会在 BFF 本地自造假令牌导致 /internal/** 被 401。配置口径对齐 pd-netty/pd-auth。
sa-token:
  token-name: token
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 端级角色绑定（X-01 下沉落点，网关只校验登录态）：逗号分隔 OR 关系，
# 角色由 pd-auth 登录写入共享 Redis 会话，BFF 经 SharedSessionStpInterface 读取。
# 未配置本键则拦截器不装配（pd-auth 等不受影响）。
pinda:
  auth:
    required-roles: ADMIN
