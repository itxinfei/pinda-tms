server:
  tomcat:
    uri-encoding: UTF-8
    max-threads: 1000
    min-spare-threads: 30
  port: 8161
  connection-timeout: 50000ms
#  servlet:
#    context-path: /pd-base

spring:
  application:
    name: pd-web-manager
  # 环境 dev|test|prod（统一为 prod，由环境变量/占位指向 192.168.20.130）
  profiles:
    active: prod
  main:
    allow-bean-definition-overriding: true
  # JDK 21 虚拟线程：Tomcat 请求处理与阻塞式 Feign 调用改跑虚拟线程，免调平台线程池
  threads:
    virtual:
      enabled: true
  cloud:
    openfeign:
      circuitbreaker:
        # Feign 熔断降级总开关（实现为 Resilience4j；各 XxxFeignFallback 由此生效）
        enabled: true

