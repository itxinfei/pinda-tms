server:
  tomcat:
    uri-encoding: UTF-8
    max-threads: 200
    min-spare-threads: 10
  port: 8195
  connection-timeout: 50000ms

spring:
  application:
    name: xf-file-server
  # 环境 dev|test|prod|docker。现网容器未注入 SPRING_PROFILES_ACTIVE（同其余 xf-* 服务），
  # 中间件地址实际由 compose 的 nacos-env/mysql-env 锚点以环境变量覆写。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
  # 远程配置经 config.import 接入（姿势对齐 xf-user）；optional = 远程缺失不阻断启动。
  # ⚠️ 云端必须在 group xinfei-tms 建同名 dataId，否则静默回落本文件（见改名工程教训）。
  config:
    import:
      - optional:nacos:xf-file-server.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        namespace: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
        group: xinfei-tms
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
      config:
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        namespace: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
        group: xinfei-tms
        file-extension: yml
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
  jackson:
    time-zone: ${JACKSON_TIME_ZONE:GMT+8}
    date-format: ${JACKSON_DATE_FORMAT:yyyy-MM-dd HH:mm:ss}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}

# 附件落盘与对外访问口径（compose/Nacos 可覆盖）
xinfei:
  file:
    # 容器内路径，compose 挂载宿主 /data/attachments 到此路径
    upload-root: ${XINFEI_FILE_UPLOAD_ROOT:/data/attachments}
    # 查看 URL 前缀 = 网关匿名路由 /api/file/**（StripPrefix=2 → /view/**）
    public-base-url: ${XINFEI_FILE_PUBLIC_BASE_URL:http://192.168.20.130:8760/api/file/view}

management:
  endpoints:
    web:
      exposure:
        include: health
