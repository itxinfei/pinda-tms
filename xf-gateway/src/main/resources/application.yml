server:
  port: 8760

spring:
  application:
    name: xf-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Spring Cloud 标准接入方式（取代旧 bootstrap.yml）；optional 表示远程配置缺失不阻断启动。
  # 2026-10-10 修复：dataId 扩展名与 Nacos 实际配置对齐（xf-gateway.yml，原 .yaml 不匹配导致远程配置未被加载）
  config:
    import:
      - optional:nacos:xf-gateway.yml
  cloud:
    nacos:
      # 服务注册
      discovery:
        # 变量名与 deploy/apps/docker-compose.app.yml 的 nacos-env 锚点对齐
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        namespace: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
        group: xinfei-tms
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
      # 配置中心
      config:
        server-addr: ${NACOS_SERVER_ADDR:192.168.20.130:8848}
        namespace: 1cb93ce4-dc0e-4730-b759-d35fd7ed93c3
        group: xinfei-tms
        file-extension: yaml
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
    gateway:
      # 不开启按服务名自动路由，路由显式声明，避免内部服务被意外暴露
      discovery:
        locator:
          enabled: false
      routes:
        # 认证服务：/api/auth/** -> xf-auth，去掉 /api/auth 两段前缀（/api/auth/anno/login -> /anno/login）
        - id: xf-auth
          uri: lb://xf-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=2
        # 系统管理（youlai 契约）：/api/v1/** -> xf-auth，去掉 /api/v1 两段前缀
        # （/api/v1/users -> /users；/api/v1/menus/routes -> /menus/routes）。
        # 同样过网关登录态校验并由网关注入 Same-Token；xf-auth 侧放 controller.v1 包。
        - id: xf-auth-v1
          uri: lb://xf-auth
          predicates:
            - Path=/api/v1/**
          filters:
            - StripPrefix=2
        # 管理端 BFF：/api/manager/** -> xf-web-manager，去掉 /api/manager 两段前缀
        - id: xf-web-manager
          uri: lb://xf-web-manager
          predicates:
            - Path=/api/manager/**
          filters:
            - StripPrefix=2
        # 移动三端 BFF：/api/web-{driver,courier,customer}/** -> 对应 xf-web-*，去掉 /api/web-* 两段前缀
        # 前端 H5 走 /prod-api/web-*（容器 nginx rewrite 成网关 /api/web-*），App/小程序直连 :8760/api/web-*
        - id: xf-web-driver
          uri: lb://xf-web-driver
          predicates:
            - Path=/api/web-driver/**
          filters:
            - StripPrefix=2
        - id: xf-web-courier
          uri: lb://xf-web-courier
          predicates:
            - Path=/api/web-courier/**
          filters:
            - StripPrefix=2
        - id: xf-web-customer
          uri: lb://xf-web-customer
          predicates:
            - Path=/api/web-customer/**
          filters:
            - StripPrefix=2
        # 轨迹/定位服务：/api/netty-service/** -> xf-netty，去掉 /api/netty-service 两段前缀
        # （/api/netty-service/trace/replay -> /trace/replay；/api/netty-service/netty/push -> /netty/push）
        - id: xf-netty
          uri: lb://xf-netty
          predicates:
            - Path=/api/netty-service/**
          filters:
            - StripPrefix=2
        # 文件服务：/api/file/** -> xf-file-server，去掉 /api/file 两段前缀
        # （查看图片 /api/file/view/{bizType}/{yyyyMM}/{uuid}.jpg -> /view/...；img src 无法带
        #  token，匿名放行仅限 /api/file/view/**，见 SaTokenConfigure 白名单）
        - id: xf-file-server
          uri: lb://xf-file-server
          predicates:
            - Path=/api/file/**
          filters:
            - StripPrefix=2
  # Redis（Sa-Token 会话 + Same-Token 读取）
  data:
    redis:
      host: ${REDIS_HOST:192.168.20.130}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:123456}

# Sa-Token 配置（与子服务一致，网关据此读取登录态）
sa-token:
  # token 头字段（全端统一）
  token-name: token
  # 有效期 7200 秒
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# Actuator 端点收敛（T-SEC-02/A6）：仅暴露 health（compose 探针），其余全部关闭
management:
  endpoints:
    web:
      exposure:
        include: health

# 安全基线（T-SEC-01/02）：阈值与白名单全部配置化（禁硬编码纪律），生产经 Nacos xf-gateway.yml 覆盖
xinfei:
  security:
    # 限流阈值（次/分钟）：登录/验证码按 IP 严限，通用按 IP 兜底 + 登录用户计数
    rate-limit:
      # dev 演示口径（办公室 NAT 同出口 IP 多人共用，过严会误伤正常登录/看板轮询）；
      # 生产上线经 Nacos 收紧为 login 5 / captcha 10 / user 300 / ip 2000
      login-per-minute: 30     # /api/auth/anno/login（防撞库）
      captcha-per-minute: 30   # /api/auth/anno/captcha（防轰炸）
      user-per-minute: 1000
      ip-per-minute: 5000      # 兜底（A1）
    # CORS origin 白名单（逗号分隔 pattern）：dev 未配置回落通配；生产必须覆盖，如
    # https://admin.xinfei.cn,https://driver.xinfei.cn,https://courier.xinfei.cn,https://customer.xinfei.cn
    cors:
      allowed-origin-patterns: ""
    # CSP（A13）：仅在非空时下发。dev 置空不下发（CSP 配错会挡正常资源）；
    # 生产上线前配置白名单并逐端回归三条用例：管理端下单页地图 / 大屏 WS / 司机端定位。
    # 生产参考串（须回归后再启用）：
    #   "default-src 'self'; script-src 'self' *.baidu.com; img-src 'self' data: blob: *.baidu.com *.bcebos.com; connect-src 'self' *.baidu.com *.bcebos.com wss:; style-src 'self' 'unsafe-inline'; font-src 'self' data:"
    csp: ""
